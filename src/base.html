<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOS_v1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: header + four views. "Сегодня" is the day cockpit: routine, habits and today's tasks on the left, "Завтра" on the right on wide screens (stacked on the phone). Timer and night screen are full-screen overlays. */
:root {
  --bg: #ECEEF2; --surface: #FFFFFF; --surface-2: #F5F6F9; --ink: #14161C; --muted: #6A7183; --line: #D9DDE6;
  --accent: #FF5A1F; --on-accent: #1B0F0A; --done: #23A06A; --track: #E1E4EB; --danger: #D23B3B;
  --good-bg: #DCF0E4; --good-ink: #14663F; --over-bg: #F7DDDA; --over-ink: #9E2219;
  --night-bg: #06070A; --night-fg: #8E95A7; --night-hi: #E4E7EE; --night-line: #1C1F27;
  --pc-orange-bg: #FFE6D9; --pc-orange: #A8410F; --pc-red-bg: #FBE0DE; --pc-red: #A3261C;
  --pc-yellow-bg: #FBF0CF; --pc-yellow: #7E5A00; --pc-violet-bg: #ECE5FC; --pc-violet: #5B3CC4;
  --pc-blue-bg: #DFEAFC; --pc-blue: #1F5BB8; --pc-green-bg: #DCF1E3; --pc-green: #17693F;
  --pc-aqua-bg: #D8F2F2; --pc-aqua: #0F6B6B; --pc-gray-bg: #E7E9EE; --pc-gray: #4B5263;
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1116; --surface: #191C24; --surface-2: #14171E; --ink: #EEF0F5; --muted: #8C93A5; --line: #272B36;
    --accent: #FF6E35; --done: #36C383; --track: #262A35; --danger: #FF6B6B;
    --good-bg: #12301F; --good-ink: #5CCB93; --over-bg: #391614; --over-ink: #FF8B80;
    --pc-orange-bg: #3A2116; --pc-orange: #FF9F6E; --pc-red-bg: #3A1A18; --pc-red: #FF8F86;
    --pc-yellow-bg: #352B12; --pc-yellow: #F2C14E; --pc-violet-bg: #2A2142; --pc-violet: #B9A3FF;
    --pc-blue-bg: #172840; --pc-blue: #8DB8FF; --pc-green-bg: #13301F; --pc-green: #6FD49B;
    --pc-aqua-bg: #11302F; --pc-aqua: #6ED6D3; --pc-gray-bg: #262A33; --pc-gray: #A9B0C0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1116; --surface: #191C24; --surface-2: #14171E; --ink: #EEF0F5; --muted: #8C93A5; --line: #272B36;
  --accent: #FF6E35; --done: #36C383; --track: #262A35; --danger: #FF6B6B;
  --good-bg: #12301F; --good-ink: #5CCB93; --over-bg: #391614; --over-ink: #FF8B80;
  --pc-orange-bg: #3A2116; --pc-orange: #FF9F6E; --pc-red-bg: #3A1A18; --pc-red: #FF8F86;
  --pc-yellow-bg: #352B12; --pc-yellow: #F2C14E; --pc-violet-bg: #2A2142; --pc-violet: #B9A3FF;
  --pc-blue-bg: #172840; --pc-blue: #8DB8FF; --pc-green-bg: #13301F; --pc-green: #6FD49B;
  --pc-aqua-bg: #11302F; --pc-aqua: #6ED6D3; --pc-gray-bg: #262A33; --pc-gray: #A9B0C0;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 40px);
}
body.has-mini { padding-bottom: 120px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 900px) { .wrap { max-width: 1100px; } }

/* header */
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .28)); }
.mark svg { width: 100%; height: 100%; display: block; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
.ver { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; align-self: flex-start; }
.sub { color: var(--muted); font-weight: 600; font-size: 13px; margin-top: 5px; font-variant-numeric: tabular-nums; }
.hdr-right { display: flex; gap: 8px; align-items: center; }
.ghost { flex: none; font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.ghost[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.count-pill { font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: 999px; background: var(--pc-orange-bg); color: var(--pc-orange); white-space: nowrap; }

/* view tabs */
nav.views { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
nav.views button { padding: 10px 6px; border-radius: 12px; font-weight: 800; font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
nav.views button svg { width: 16px; height: 16px; flex: none; }
nav.views button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 420px) { nav.views button svg { display: none; } }
@media (min-width: 900px) { nav.views { max-width: 560px; } }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-t { font-family: var(--f-display); font-weight: 700; font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
.card-t svg { width: 18px; height: 18px; }
.small-label { font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sum { color: var(--muted); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); border-radius: 99px; transition: width .4s ease; }
.link { color: var(--muted); font-weight: 700; font-size: 14px; padding: 6px 8px; }
.link.accent { color: var(--accent); }
.note-line { color: var(--muted); font-size: 13px; text-align: center; }
.notes { width: 100%; min-height: 140px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font: inherit; font-size: 15px; font-weight: 500; line-height: 1.5; color: var(--ink); resize: vertical; overflow: hidden; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; } }

/* focus */
.focus { background: var(--surface-2); border: 1px solid var(--line); border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.focus-t { font-weight: 800; font-size: 16px; }
.focus-items { display: flex; flex-wrap: wrap; gap: 6px; }
.fi { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.fi.done { background: var(--good-bg); color: var(--good-ink); border-color: transparent; text-decoration: line-through; }

/* tasks */
ul.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-height: 8px; }
.task {
  display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 8px 8px 8px 10px; min-height: 58px; position: relative; transition: transform .18s ease, box-shadow .18s ease;
}
.card .task { background: var(--surface-2); }
.task.live { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.task.dragging { transition: none; z-index: 5; box-shadow: 0 14px 30px rgba(0,0,0,.22); border-color: var(--accent); }
.check { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface); }
.check svg { width: 16px; height: 16px; opacity: 0; }
.task.done .check { background: var(--done); border-color: var(--done); }
.task.done .check svg { opacity: 1; color: var(--surface); }
.go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; padding: 4px 0; min-height: 40px; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; }
.name { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.task.done .name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.note { font-size: 13px; font-weight: 500; color: var(--muted); overflow-wrap: anywhere; }
.pchip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.pchip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sess { font-size: 12px; font-weight: 700; color: var(--muted); }
.mins { flex: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--accent); color: var(--on-accent); padding: 7px 11px 7px 9px; border-radius: 999px; }
.mins svg { width: 11px; height: 11px; }
.spent { flex: none; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; padding: 7px 11px; border-radius: 999px; }
.spent.good { background: var(--good-bg); color: var(--good-ink); }
.spent.over { background: var(--over-bg); color: var(--over-ink); }
.spent.neutral { background: var(--track); color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 14px 8px; font-weight: 600; font-size: 14px; }
ul.tl.drop-target { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 18px; }

.pc-orange { background: var(--pc-orange-bg); color: var(--pc-orange); } .pc-red { background: var(--pc-red-bg); color: var(--pc-red); }
.pc-yellow { background: var(--pc-yellow-bg); color: var(--pc-yellow); } .pc-violet { background: var(--pc-violet-bg); color: var(--pc-violet); }
.pc-blue { background: var(--pc-blue-bg); color: var(--pc-blue); } .pc-green { background: var(--pc-green-bg); color: var(--pc-green); }
.pc-aqua { background: var(--pc-aqua-bg); color: var(--pc-aqua); } .pc-gray { background: var(--pc-gray-bg); color: var(--pc-gray); }

/* edit rows */
.edit-row { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.edit-row input[type=text], .edit-row input[type=date], .edit-row select, .field {
  min-width: 0; padding: 9px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px;
}
.edit-row input.nm { flex: 1 1 160px; }
.edit-row input.nt { flex: 1 1 100%; border-style: dashed; background: transparent; font-weight: 500; color: var(--muted); font-size: 14px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.step button { width: 32px; height: 36px; font-weight: 800; font-size: 18px; }
.step span { min-width: 52px; text-align: center; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); flex: none; }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn.del { color: var(--danger); }
.handle { touch-action: none; cursor: grab; color: var(--muted); }
.fold { width: 32px; height: 32px; border-radius: 10px; color: var(--muted); }
.fold svg { transition: transform .2s ease; }
.fold[aria-expanded="false"] svg { transform: rotate(-90deg); }
.act { font-size: 13px; font-weight: 800; padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.act.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* add form */
.add { border: 1px dashed var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.add input[type=text] { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 16px; }
.add-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); font-weight: 700; font-size: 13px; background: var(--surface); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.kt[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.add select { padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13px; }
.pill-btn { padding: 9px 16px; border-radius: 999px; font-weight: 800; background: var(--ink); color: var(--bg); margin-left: auto; }
.pill-btn:disabled { opacity: .35; }

/* routine */
.routine.morning { border-color: var(--pc-orange-bg); }
.routine.evening { border-color: var(--pc-violet-bg); }
.r-ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; }
.r-ic svg { width: 17px; height: 17px; }
.r-done { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--good-ink); background: var(--good-bg); border-radius: 16px; padding: 10px 14px; }
.r-done svg { width: 18px; height: 18px; flex: none; }
.end-day { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 16px; border-radius: 18px; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 16px; }
.end-day svg { width: 18px; height: 18px; }

/* habits */
.hchips { display: flex; flex-wrap: wrap; gap: 6px; }
.hc { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 14px; }
.hc svg { width: 14px; height: 14px; }
.hc.on { background: var(--good-bg); color: var(--good-ink); border-color: transparent; }
.auto { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hgrid { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 34px) 64px; gap: 6px; align-items: center; }
.hgrid .hd { font-size: 11px; font-weight: 800; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; line-height: 1.2; }
.hgrid .hd.today { color: var(--accent); }
.hname { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 2px; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; justify-self: center; }
.dot svg { width: 14px; height: 14px; opacity: 0; color: var(--surface); }
.dot.on { background: var(--done); border-color: var(--done); }
.dot.on svg { opacity: 1; }
.dot.off { opacity: .3; }
.dot:disabled { opacity: .25; cursor: default; }
.streak { font-weight: 800; font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.streak.hot { color: var(--accent); }
.hgrid-wrap { min-width: 0; }
@media (max-width: 600px) {
  .hgrid { grid-template-columns: repeat(7, minmax(0, 1fr)) 44px; row-gap: 4px; }
  .hgrid .hd0 { display: none; }
  .hname { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-top: 8px; }
}

/* stats */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font-family: var(--f-display); font-weight: 500; font-size: 24px; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-weight: 700; font-size: 13px; }
.brow { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) 76px; gap: 10px; align-items: center; }
.brow .bl { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .bt { height: 12px; border-radius: 99px; background: var(--track); overflow: hidden; }
.brow .bt i { display: block; height: 100%; border-radius: 99px; }
.brow .bv { font-weight: 800; font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.wk-nav { display: flex; align-items: center; gap: 8px; }
.srow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; padding: 6px 0; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow .sd { font-weight: 800; }
.srow .sv { text-align: right; font-weight: 800; }

/* slim folded cards */
.card.slim { padding: 6px 8px 6px 14px; gap: 0; border-radius: 16px; }
.card.slim .card-h { flex-wrap: nowrap; min-height: 34px; }
.card.slim .card-t { font-size: 15px; }
.card.slim .bar { display: none; }
.focus.slim { padding: 4px 8px 4px 14px; border-radius: 16px; }
.focus.slim .card-h { flex-wrap: nowrap; min-height: 34px; }
.focus.slim .small-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pen { flex: none; width: 30px; height: 30px; border-radius: 9px; color: var(--muted); display: grid; place-items: center; opacity: .65; }
.pen svg { width: 14px; height: 14px; }
.task:hover .pen, .pen:focus-visible { opacity: 1; }
.task input.inline { flex: 1; min-width: 0; font: inherit; font-weight: 700; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--accent); background: var(--surface); color: var(--ink); }
.name.ed { cursor: text; }
.task input.inline { -webkit-user-select: text; user-select: text; }
.kinds { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.kinds::-webkit-scrollbar { display: none; }
.kinds .chip { flex: none; }
.chip .k { font-weight: 800; opacity: .7; margin-left: 4px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--track); align-self: flex-start; gap: 2px; }
.seg button { padding: 7px 14px; border-radius: 999px; font-weight: 800; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.cal-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-h .t { font-family: var(--f-display); font-weight: 700; font-size: 18px; text-transform: capitalize; }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-g .wd { text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--muted); padding: 4px 0; text-transform: uppercase; }
.cal-d { height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px 2px 5px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.cal-d.out { opacity: .38; }
.cal-d.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-d[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cal-dots { display: flex; gap: 3px; height: 8px; align-items: center; }
.cal-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.cal-dots i.dn { background: var(--done); }
.cal-dots b { font-size: 10px; font-weight: 800; }

    if (!items.length) ul.innerHTML = `<li class="empty">${esc(filt && itemsOf(key).length ? "Всё скрыто фильтром." : emptyText)}</li>`;

  function addForm(key, opts = {}) {
    const f = document.createElement("form");

      ${withProject ? `<select aria-label="Проект" id="addp-${key}">${projectOptions(drafts["p-" + key] ?? (filterProject !== "all" ? filterProject : (S.projects.find((p) => onlyKind() && p.kind === onlyKind())?.id || "")))}</select>` : ""}
      ${opts.where ? `<select aria-label="Куда" id="addw-${key}"><option value="backlog">В дела</option><option value="today">Сегодня</option><option value="tomorrow">Завтра</option><option value="wait">Жду</option></select>` : ""}

    const inp = f.querySelector("input"), btn = f.querySelector(".pill-btn");
    inp.value = drafts[key] || ""; btn.disabled = !inp.value.trim();
    inp.oninput = () => { drafts[key] = inp.value; btn.disabled = !inp.value.trim(); };
    const ps = f.querySelector(`#addp-${key}`); if (ps) ps.onchange = () => { drafts["p-" + key] = ps.value; };
    f.querySelectorAll(".chip").forEach((c) => c.onclick = () => { chosen[key] = +c.dataset.m; f.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === c)); });
    f.onsubmit = (e) => {
      e.preventDefault();
      const v = inp.value.trim(); if (!v) return;
      const min = chosen[key] ?? sel;
      if (isRoutine(key)) S.routines[key].push({ id: uid(), name: v, min, done: false, spent: 0, note: "" });
      else {
        const where = opts.where ? f.querySelector(`#addw-${key}`).value : key;
        S.tasks.push({ id: uid(), name: v, min, done: false, spent: 0, note: "", project: ps ? ps.value : "", where, sessions: 0, acc: 0, waitUntil: where === "wait" ? addDays(dayISO(), 2) : "", doneAt: 0, due: "" });
      }
      drafts[key] = "";
      persist(); render();
      const again = $("add-" + key); if (again) again.focus();
    };
    return f;
  }
  const sumLine = (items) => {
    const done = items.filter((t) => t.done).length, left = items.filter((t) => !t.done).reduce((s, t) => s + t.min, 0);

  function renderToday() {

    const today = dayISO();
    const wrap = document.createElement("div"); wrap.className = "col";

    // week focus
    const wk = S.weeks.find((w) => w.start === mondayOf(today));
    if (wk) {
      const f = document.createElement("div"); f.className = "focus" + (focusOpen ? "" : " slim");
      f.innerHTML = `<div class="card-h"><span class="small-label">Фокус недели · <span style="color:var(--ink)">${esc(wk.focus)}</span></span><div class="hdr-right"></div></div><div class="focus-items"${focusOpen ? "" : " hidden"}></div>`;
      f.querySelector(".hdr-right").appendChild(foldBtn(focusOpen, "фокус недели", () => { focusOpen = !focusOpen; saveUI(); render(); }));
      const box = f.querySelector(".focus-items");
      (wk.items || []).forEach((it) => {
        const b = document.createElement("button");
        b.className = "fi" + (it.d ? " done" : "");
        b.innerHTML = (it.d ? I.check.replace('stroke-width="3.2"', 'stroke-width="3.2" width="12" height="12"') : "") + `<span>${esc(it.t)}</span>`;

    }

    // routine block
    const evening = S.day.evening === today;

    const morningDone = mItems.length && mItems.every((t) => t.done);
    if (evening) left.appendChild(routineCard("evening"));
    else if (!morningDone) left.appendChild(routineCard("morning"));
    else {

      const d = document.createElement("div"); d.className = "r-done";

      left.appendChild(d);
    }

    // habits
    const hc = document.createElement("div"); hc.className = "card" + (habitsOpen ? "" : " slim");
    const hs = S.habits.filter((h) => habitApplies(h, today));
    const hdone = hs.filter((h) => habitDone(h.id, today)).length;
    hc.innerHTML = `<div class="card-h"><h2 class="card-t">${I.repeat}Привычки</h2><div class="hdr-right"><span class="sum">${hdone} из ${hs.length}</span></div></div><div class="hchips"${habitsOpen ? "" : " hidden"}></div>`;
    hc.querySelector(".hdr-right").appendChild(foldBtn(habitsOpen, "привычки", () => { habitsOpen = !habitsOpen; saveUI(); render(); }));
    const hbox = hc.querySelector(".hchips");
    hs.forEach((h) => {
      const on = habitDone(h.id, today);
      const b = document.createElement("button");
      b.className = "hc" + (on ? " on" : "");
      b.innerHTML = (on ? I.check : "") + `<span>${esc(h.name)}</span>` + (h.auto && !on ? `<span class="auto">авто</span>` : "");
      b.title = h.auto === "wake" ? "Отмечается само, если начать утро до 9:15" : h.auto === "sleep" ? "Отмечается само, если закрыть день до 01:15" : "";
      b.onclick = () => { setHabit(h.id, today, !on); persist(); render(); };
      hbox.appendChild(b);
    });
    left.appendChild(hc);

    // today tasks
    const tc = document.createElement("div"); tc.className = "card";
    const tItems = itemsOf("today").filter(kmatch);
    tc.innerHTML = `<div class="card-h"><h2 class="card-t">${I.home}Сегодня</h2><span class="sum">${sumLine(tItems)}</span><div class="seg sm" role="group" aria-label="Вид"><button data-tm="list" aria-pressed="${todayMode === "list"}">Список</button><button data-tm="cal" aria-pressed="${todayMode === "cal"}">День</button></div><button class="act primary" id="startNow">Начать сейчас</button></div>`;
    tc.querySelectorAll("[data-tm]").forEach((b) => b.onclick = () => { const m = b.dataset.tm; if (m === todayMode) return; if (m === "list") reorderToday(); todayMode = m; saveUI(); render(); });
    tc.querySelector("#startNow").onclick = startNow;

    else tc.appendChild(renderList("today", "Перетащи сюда задачи из «Завтра» или возьми из «Дел»."));
    { const hh = hiddenHint("today"); if (hh) tc.appendChild(hh); }
    { const n = doneCount(); if (n) { const cb = document.createElement("button"); cb.className = "link"; cb.style.alignSelf = "flex-start"; cb.id = "clearDone"; cb.textContent = "Очистить завершённые (" + n + ")"; cb.onclick = clearDone; tc.appendChild(cb); } }
    tc.appendChild(addForm("today", { placeholder: "Что сделать сегодня?" }));
    const back = S.tasks.filter((t) => t.where === "backlog").length;
    if (back) {
      const pk = document.createElement("button"); pk.className = "link accent"; pk.style.alignSelf = "flex-start";
      pk.textContent = `Взять из дел (${back}) →`;
      pk.onclick = () => { view = "tasks"; lsSet(LS_VIEW, view); render(); window.scrollTo({ top: 0 }); };
      tc.appendChild(pk);
    }
    left.appendChild(tc);

    if (!evening) {
      const ed = document.createElement("button"); ed.className = "end-day";
      ed.innerHTML = `${I.moon}<span>Пора завершать этот день</span>`;
      ed.onclick = () => { S.day.evening = today; persist(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
      left.appendChild(ed);
    }

    // tomorrow
    const tm = document.createElement("div"); tm.className = "card";
    const mItemsT = itemsOf("tomorrow").filter(kmatch);
    tm.innerHTML = `<div class="card-h"><h2 class="card-t">${I.sun}Завтра</h2><span class="sum">${sumLine(mItemsT)}</span></div>`;
    tm.appendChild(renderList("tomorrow", "Накидай сюда дела на завтра."));
    { const hh = hiddenHint("tomorrow"); if (hh) tm.appendChild(hh); }
    tm.appendChild(addForm("tomorrow", { placeholder: "Что сделать завтра?" }));
    if (mItemsT.length) {
      const all = document.createElement("button"); all.className = "link"; all.style.alignSelf = "flex-start";
      all.textContent = "Перенести всё в «Сегодня»";
      all.onclick = () => { mItemsT.forEach((t) => moveTask(t, "today")); persist(); render(); };
      tm.appendChild(all);
    }
    right.appendChild(tm);

    // free-form notes for Claude
    const nc = document.createElement("div"); nc.className = "card";
    nc.innerHTML = `<div class="card-h"><h2 class="card-t">Заметки</h2><div class="hdr-right"><span class="sum" id="notesState">${S.notes ? "сохранено" : ""}</span><button class="act" id="notesClear">Очистить</button><button class="act primary" id="notesCopy">Скопировать</button></div></div>
      <textarea id="notesArea" class="notes" placeholder="Мысли и комментарии для Claude. Сохраняется само, с телефона и с компа."></textarea>`;
    const ta = nc.querySelector("textarea");
    ta.value = S.notes || "";
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(140, ta.scrollHeight + 2) + "px"; };
    const saveNotes = () => { clearTimeout(notesTimer); notesTimer = null; notesDirty = false; persist(); const st = $("notesState"); if (st) st.textContent = S.notes ? "сохранено" : ""; };
    ta.oninput = () => { S.notes = ta.value; notesDirty = true; $("notesState").textContent = "сохраняю…"; clearTimeout(notesTimer); notesTimer = setTimeout(saveNotes, 700); grow(); };
    ta.onblur = () => { if (notesDirty) saveNotes(); };
    nc.querySelector("#notesCopy").onclick = (e) => {
      const b = e.currentTarget, ok = () => { b.textContent = "Скопировано"; setTimeout(() => { b.textContent = "Скопировать"; }, 1500); };

    };
    nc.querySelector("#notesClear").onclick = (e) => {
      const b = e.currentTarget;

    right.appendChild(nc);
    requestAnimationFrame(grow);

    cols.append(left, right);
    wrap.appendChild(cols);
    el.appendChild(wrap);
  }
  function routineCard(key) {
    const items = S.routines[key];
    const c = document.createElement("div"); c.className = "card routine " + key;
    const done = items.filter((t) => t.done).length;
    const left = items.filter((t) => !t.done).reduce((s, t) => s + t.min, 0);
    const open = key === "evening" || editing || morningOpen;
    if (!open) c.classList.add("slim");
    c.innerHTML = `<div class="card-h"><h2 class="card-t"><span class="r-ic ${key === "morning" ? "pc-orange" : "pc-violet"}">${key === "morning" ? I.sun : I.moon}</span>${key === "morning" ? "Утро" : "Вечер"}</h2>
      <span class="sum">${done} из ${items.length}${left ? " · осталось " + left + " мин" : ""}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${items.length ? done / items.length * 100 : 0}%"></i></div>`;
    if (key === "morning" && !editing) {
      const h = c.querySelector(".card-h"), wrapR = document.createElement("div");
      wrapR.className = "hdr-right"; wrapR.appendChild(h.querySelector(".sum"));

      h.appendChild(wrapR);
    }
    if (open) {
      c.appendChild(renderList(key, "Добавь первый пункт рутины."));

    }

      cancel.onclick = () => { S.day.evening = null; persist(); render(); };

  function renderTasks() {

      const b = document.createElement("button"); b.textContent = l; b.setAttribute("aria-pressed", tasksMode === id);
      b.onclick = () => { if (id === "cal" && calSel) calMonth = calSel.slice(0, 7) + "-01"; tasksMode = id; saveUI(); render(); };
      seg.appendChild(b);
    });
    col.appendChild(seg);
    col.appendChild(kindBar());

    // project filter
    const fl = document.createElement("div"); fl.className = "filters";
    const mkF = (id, label, color) => {
      const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", filterProject === id);
      const pr = proj(id), kn = pr ? (KINDS.find((k) => k[0] === pr.kind) || KINDS[0])[1] : "";
      b.innerHTML = (color ? `<span class="pchip pc-${color}" style="padding:0 6px">&nbsp;</span>` : "") + `<span>${esc(label)}</span>` + (editing && color ? `<span class="k" data-k="1" title="Тип проекта">${kn}</span><span class="x" data-x="1" aria-label="Удалить проект">×</span>` : "");
      b.onclick = (e) => {
        if (e.target.dataset.k) { const i = KIND_IDS.indexOf(pr.kind); pr.kind = KIND_IDS[(i + 1) % KIND_IDS.length]; persist(); render(); return; }
        if (e.target.dataset.x) {
          if (armedDel !== id) { armedDel = id; b.querySelector(".x").textContent = "удалить?"; return; }
          S.projects = S.projects.filter((p) => p.id !== id); S.tasks.forEach((t) => { if (t.project === id) t.project = ""; });

      };
      fl.appendChild(b);
    };
    mkF("all", "Все");
    S.projects.filter((p) => !hidden.has(p.kind)).forEach((p) => mkF(p.id, p.name, p.color));
    if (!hidden.has("other")) mkF("", "Без проекта");
    col.appendChild(fl);
    if (editing) {

      pf.onsubmit = (e) => { e.preventDefault(); const v = pf.querySelector("input").value.trim(); if (!v) return;

      col.appendChild(pf);

    const match = tmatch;

    col.appendChild(ac);

            <button class="act primary" data-a="today">Сегодня</button>`;
          li.querySelector('[data-a="today"]').onclick = () => { t.waitUntil = ""; moveTask(t, "today"); persist(); render(); };
          const wn = li.querySelector(".name"); wn.classList.add("ed"); wn.onclick = () => inlineEdit(li, t, wn);
        } else {
          li.innerHTML = `<div class="edit-row"><input type="text" class="nm" maxlength="90" value="${esc(t.name)}" aria-label="Название">

            <button type="button" class="icon-btn del" data-a="del" aria-label="Удалить">${I.del}</button>
            <input type="text" class="nt" maxlength="160" placeholder="Чего жду и от кого" value="${esc(t.note)}" aria-label="Комментарий"></div>`;
          const nm = li.querySelector(".nm"), nt = li.querySelector(".nt"), dt = li.querySelector("input[type=date]");
          nm.onchange = () => { const v = nm.value.trim(); if (v) { t.name = v; persist(); } };
          nt.onchange = () => { t.note = nt.value.trim(); persist(); };
          dt.onchange = () => { t.waitUntil = dt.value; persist(); render(); };
          li.querySelector('[data-a="back"]').onclick = () => { t.waitUntil = ""; moveTask(t, "backlog"); persist(); render(); };
          li.querySelector('[data-a="del"]').onclick = () => { S.tasks.splice(S.tasks.indexOf(t), 1); persist(); render(); };
        }
        ul.appendChild(li);
      });
      wc.appendChild(ul); col.appendChild(wc);
    }

    // backlog grouped by project
    const groups = [...S.projects.filter((p) => !hidden.has(p.kind)).map((p) => ({ id: p.id, name: p.name, color: p.color })), ...(!hidden.has("other") ? [{ id: "", name: "Без проекта", color: "" }] : [])];
    let any = false;
    groups.forEach((g) => {
      if (filterProject !== "all" && filterProject !== g.id) return;
      const items = S.tasks.filter((t) => t.where === "backlog" && t.project === g.id);
      if (!items.length) return;
      any = true;
      const gc = document.createElement("div"); gc.className = "card";
      gc.innerHTML = `<div class="group-h">${g.color ? `<span class="pchip pc-${g.color}" style="font-size:13px;padding:4px 10px">${esc(g.name)}</span>` : `<span class="small-label">${esc(g.name)}</span>`}<span class="sum">${items.length} · ${items.reduce((s, t) => s + t.min, 0)} мин</span></div>`;
      const ul = document.createElement("ul"); ul.className = "tl";
      items.forEach((t) => {
        if (editing) { ul.appendChild(renderRow(t, "backlog")); return; }
        const li = document.createElement("li"); li.className = "task";
        li.innerHTML = `<div class="txt"><span class="name">${esc(t.name)}</span>${t.note || t.sessions || t.due ? `<span class="meta">${t.due ? `<span class="dchip">${shortDate(t.due)}</span>` : ""}${t.note ? `<span class="note">${esc(t.note)}</span>` : ""}${t.sessions ? `<span class="sess">${t.sessions} сес. · ${durShort(t.acc)}</span>` : ""}</span>` : ""}</div>
          ${t.min ? `<span class="sess">${t.min} мин</span>` : ""}
          <button class="act" data-a="tomorrow">Завтра</button><button class="act primary" data-a="today">Сегодня</button>`;
        const nmEl = li.querySelector(".name"); nmEl.classList.add("ed"); nmEl.title = "Нажми, чтобы изменить"; nmEl.onclick = () => inlineEdit(li, t, nmEl);
        li.querySelector('[data-a="today"]').onclick = () => { moveTask(t, "today"); persist(); render(); };
        li.querySelector('[data-a="tomorrow"]').onclick = () => { moveTask(t, "tomorrow"); persist(); render(); };
        ul.appendChild(li);

      gc.appendChild(ul); col.appendChild(gc);

      const e = document.createElement("div"); e.className = "empty";
      e.textContent = filterProject === "all" ? "Склад пуст. Добавь дело выше: сюда падает всё, что не на сегодня." : "В этом проекте пока нет дел.";
      col.appendChild(e);
    }

    const grid = document.createElement("div"); grid.className = "dgrid"; grid.style.height = H + "px"; grid.dataset.start = startH;
    for (let h = startH; h < endH; h++) {

      const q = document.createElement("div"); q.className = "hq"; q.style.top = (h - startH) * HR + HR / 2 + "px"; grid.appendChild(q);
      if (HR >= 112) [0.25, 0.75].forEach((f) => { const q2 = document.createElement("div"); q2.className = "hq hq2"; q2.style.top = (h - startH) * HR + HR * f + "px"; grid.appendChild(q2); });

      if (armedTask) placeAt(armedTask, m);
      else if (canAdd) openSheet({ isNew: true, at: hhmm(m), name: "", min: 25, project: S.projects.find((p) => onlyKind() && p.kind === onlyKind())?.id || "" });
    };
    grid.appendChild(slots);
    layoutBlocks(timed).forEach((it) => {
      const t = it.t, top = (it.s - startH * 60) / 60 * HR, h = Math.max(22, (it.e - it.s) / 60 * HR - 2);
      const b = document.createElement("div"); b.className = "dblk pc-" + (proj(t.project)?.color || "gray") + (t.done || t.where === "done" ? " done" : "") + (h < 40 ? " sm" : "") + (h > 56 ? " tall" : "");
      b.dataset.id = t.id; b.style.top = top + "px"; b.style.height = h + "px";
      b.style.left = `calc(${it.col / it.cols * 100}% + 2px)`; b.style.width = `calc(${100 / it.cols}% - 4px)`;
      b.innerHTML = `<button class="dchk" aria-label="Отметить"${canToggle(t) ? "" : " disabled"}>${I.check}</button><span class="dtx"><b>${esc(t.name)}</b><i>${t.at}${t.min ? " · " + t.min + " мин" : ""}</i></span>${t.min && !t.done && t.where !== "done" ? `<button class="dplay" aria-label="Запустить таймер">${I.play}</button>` : ""}`;
      const pl = b.querySelector(".dplay"); if (pl) pl.onclick = (e) => { e.stopPropagation(); startTimer(t.id); };
      b.querySelector(".dchk").onclick = (e) => { e.stopPropagation(); if (canToggle(t)) toggleDone(t); };
      b.onclick = () => openSheet({ id: t.id });
      b.addEventListener("contextmenu", (e) => e.preventDefault());
      b.addEventListener("pointerdown", (e) => {
        if (dayDrag || e.target.closest(".dchk, .dplay") || (e.pointerType === "mouse" && e.button !== 0)) return;
        dayDrag = { t, b, pid: e.pointerId, sy: e.clientY, sx: e.clientX, base: toMin(t.at), to: toMin(t.at), startH, dur: Math.max(t.min || 0, 15), active: false, mouse: e.pointerType === "mouse", timer: null };
        if (!dayDrag.mouse) dayDrag.timer = setTimeout(() => { if (dayDrag && !dayDrag.active) beginDayDrag(); }, 350);
      });
      grid.appendChild(b);
    });
    grid.addEventListener("touchmove", (e) => { if (dayDrag && dayDrag.active) e.preventDefault(); }, { passive: false });
    grid.addEventListener("wheel", (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(HR * Math.exp(-e.deltaY * 0.01), e.clientY); } }, { passive: false });

  function placeNow(grid) {
    const n = grid.querySelector(".dnow"); if (!n) return;

  }
  setInterval(() => { const g = document.querySelector(".dgrid"); if (g) placeNow(g); }, 60000);

  function beginDayDrag() {
    if (!dayDrag) return;
    dayDrag.active = true; suppressClick = true; dayDrag.b.classList.add("dragging");
    document.body.style.userSelect = "none";
    try { navigator.vibrate && navigator.vibrate(12); } catch {}
  }
  function endDayDrag(commit) {
    const d = dayDrag; if (!d) return; dayDrag = null;
    clearTimeout(d.timer); document.body.style.userSelect = "";
    if (!d.active) return;
    if (commit && d.to !== d.base) { d.t.at = hhmm(d.to); persist(); }
    render();
    setTimeout(() => { suppressClick = false; }, 60);
  }
  window.addEventListener("pointermove", (e) => {
    const d = dayDrag; if (!d || e.pointerId !== d.pid) return;
    if (!d.active) {
      const dist = Math.hypot(e.clientX - d.sx, e.clientY - d.sy);
      if (d.mouse) { if (dist > 5) beginDayDrag(); } else if (dist > 8) { clearTimeout(d.timer); dayDrag = null; }
      if (!dayDrag || !dayDrag.active) return;
    }
    e.preventDefault();
    const lo = d.startH * 60, hi = 1440 - d.dur;
    d.to = Math.max(lo, Math.min(hi, Math.round((d.base + (e.clientY - d.sy) / HR * 60) / snapV()) * snapV()));
    d.b.style.top = (d.to - lo) / 60 * HR + "px";
    const i = d.b.querySelector("i"); if (i) i.textContent = hhmm(d.to) + (d.t.min ? " · " + d.t.min + " мин" : "");
  }, { passive: false });
  window.addEventListener("pointerup", (e) => { if (dayDrag && e.pointerId === dayDrag.pid) endDayDrag(true); });

  // ---------- bottom sheet: add / edit a task on the grid ----------
  function closeSheet() { sheetSpec = null; $("sheetBg").hidden = true; $("sheet").innerHTML = ""; }
  function openSheet(spec) { sheetSpec = spec; renderSheet(); }
  function renderSheet() {
    const bg = $("sheetBg"), box = $("sheet");
    if (!sheetSpec) { bg.hidden = true; return; }
    const isNew = !!sheetSpec.isNew, id = sheetSpec.id, cur = () => S.tasks.find((x) => x.id === id);
    const t = isNew ? sheetSpec : cur();
    if (!t) { closeSheet(); return; }
    const when = fromISO(calSel);
    box.innerHTML = `<div class="sheet-h"><b>${isNew ? "Новая задача · " + when.getDate() + " " + MON[when.getMonth()] : "Задача"}</b><button class="icon-btn" id="shX" aria-label="Закрыть">${I.del.replace(/<svg[^>]*>.*<\/svg>/, '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>')}</button></div>
      <input type="text" class="field" id="sh-name" maxlength="90" placeholder="Что сделать?" value="${esc(t.name)}">
      <div class="add-row">
        <label class="f">Начало <input type="time" class="field" id="sh-at" value="${esc(t.at || "")}"></label>
        <div class="step"><button type="button" data-d="-1" aria-label="Меньше">−</button><span id="sh-min">${t.min ? t.min + " мин" : "чек"}</span><button type="button" data-d="1" aria-label="Больше">+</button></div>
      </div>
      <select class="field" id="sh-pj" aria-label="Проект">${projectOptions(t.project)}</select>
      <div class="add-row" id="sh-act"></div>`;
    const set = (k, v) => { const x = isNew ? sheetSpec : cur(); if (!x) return; x[k] = v; if (!isNew) { persist(); render(); } };
    const nm = box.querySelector("#sh-name"), at = box.querySelector("#sh-at"), pj = box.querySelector("#sh-pj");
    nm.onchange = () => { const v = nm.value.trim(); if (v) set("name", v); else nm.value = (isNew ? sheetSpec : cur())?.name || ""; };
    if (isNew) nm.oninput = () => { sheetSpec.name = nm.value; addBtn.disabled = !nm.value.trim(); };
    at.onchange = () => set("at", at.value);
    pj.onchange = () => set("project", pj.value);
    box.querySelectorAll(".step button").forEach((b) => b.onclick = () => {
      const x = isNew ? sheetSpec : cur(); if (!x) return; let m = x.min || 0;
      m = +b.dataset.d > 0 ? (m < 10 ? m + 1 : m + 5) : (m <= 10 ? m - 1 : m - 5);
      m = Math.max(0, Math.min(240, m)); box.querySelector("#sh-min").textContent = m ? m + " мин" : "чек"; set("min", m);
    });
    box.querySelector("#shX").onclick = closeSheet;
    const act = box.querySelector("#sh-act");
    const mkBtn = (label, cls, fn) => { const b = document.createElement("button"); b.type = "button"; b.className = "act " + cls; b.textContent = label; b.onclick = fn; act.appendChild(b); return b; };
    let addBtn = null;
    if (isNew) {
      addBtn = mkBtn("Добавить", "primary", () => {
        const v = (sheetSpec.name || "").trim(); if (!v) return;
        addDayTask(v, sheetSpec.min || 0, sheetSpec.project || "", sheetSpec.at || ""); closeSheet(); render();
      });
      addBtn.disabled = !(sheetSpec.name || "").trim();
      setTimeout(() => nm.focus(), 0);
    } else {
      if (canToggle(t)) mkBtn(t.done ? "Вернуть" : "Готово ✓", "primary", () => { const x = cur(); if (x) { toggleDone(x); renderSheet(); } });
      if (t.min && !t.done && canToggle(t)) mkBtn("▶ Таймер", "", () => { closeSheet(); startTimer(id); });
      if (t.at) mkBtn("Без времени", "", () => { const x = cur(); if (x) { x.at = ""; persist(); closeSheet(); render(); } });
      mkBtn("Удалить", "danger", () => { const x = cur(); if (x) { closeSheet(); deleteTask(x); } });
    }

  $("sheetBg").addEventListener("click", (e) => { if (e.target.id === "sheetBg") closeSheet(); });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetSpec) closeSheet(); });

  function renderHabits() {
    const el = $("vHabits"); el.innerHTML = "";
    const col = document.createElement("div"); col.className = "col"; col.style.maxWidth = "760px";
    const today = dayISO(), mon = mondayOf(today);
    const days = [...Array(7)].map((_, i) => addDays(mon, i));
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<div class="card-h"><h2 class="card-t">${I.repeat}Эта неделя</h2><span class="sum">${fromISO(mon).getDate()} ${MON[fromISO(mon).getMonth()]} – ${fromISO(days[6]).getDate()} ${MON[fromISO(days[6]).getMonth()]}</span></div>`;
    const gw = document.createElement("div"); gw.className = "hgrid-wrap";
    const g = document.createElement("div"); g.className = "hgrid";
    g.innerHTML = `<span class="hd0"></span>` + days.map((d) => `<span class="hd${d === today ? " today" : ""}">${WD[fromISO(d).getDay()]}<br>${fromISO(d).getDate()}</span>`).join("") + `<span class="hd">серия</span>`;
    S.habits.forEach((h) => {
      const nm = document.createElement("div"); nm.className = "hname";
      if (editing) {
        nm.innerHTML = `<input type="text" class="field" value="${esc(h.name)}" maxlength="40" aria-label="Название привычки">`;
        const inp = nm.querySelector("input"); inp.onchange = () => { const v = inp.value.trim(); if (v) { h.name = v; persist(); } };
      } else nm.innerHTML = `<span>${esc(h.name)}</span>${h.auto ? `<span class="auto">отмечается само</span>` : h.days ? `<span class="auto">${h.days.map((d) => WD[d]).join(" / ")}</span>` : ""}`;

        const b = document.createElement("button");

        b.setAttribute("aria-label", `${h.name}, ${WD[fromISO(d).getDay()]}`);
        b.onclick = () => { setHabit(h.id, d, !on); persist(); render(); };
        g.appendChild(b);
      });
      const st = document.createElement("div");
      if (editing) {
        st.innerHTML = `<button class="icon-btn del" aria-label="Удалить привычку">${I.del}</button>`;
        st.querySelector("button").onclick = () => {
          if (armedDel !== h.id) { armedDel = h.id; st.querySelector("button").style.background = "var(--over-bg)"; return; }
          S.habits = S.habits.filter((x) => x !== h); armedDel = null; persist(); render();
        };
      } else { const n = streakOf(h); st.className = "streak" + (n >= 3 ? " hot" : ""); st.textContent = n ? n + " дн" : "—"; }

    f.onsubmit = (e) => { e.preventDefault(); const v = f.querySelector("input").value.trim(); if (!v) return; S.habits.push({ id: uid(), name: v }); persist(); render(); };

    col.appendChild(c);

      sc.innerHTML = `<div class="card-h"><h2 class="card-t">Сайд-квесты</h2><span class="sum">без контроля, для удовольствия</span></div>` + S.side.map((s) => `<div class="name" style="font-size:15px">${esc(s.t)}</div>`).join("");

  function renderStats() {
    const el = $("vStats"); el.innerHTML = "";
    const col = document.createElement("div"); col.className = "col"; col.style.maxWidth = "760px";
    const today = dayISO();
    const mon = addDays(mondayOf(today), statsOffset * 7), sun = addDays(mon, 6);
    const inWeek = (iso) => iso >= mon && iso <= sun;
    const head = document.createElement("div"); head.className = "card-h";
    head.innerHTML = `<h2 class="card-t">${I.chart}${statsOffset === 0 ? "Эта неделя" : statsOffset === -1 ? "Прошлая неделя" : "Неделя"} · ${fromISO(mon).getDate()}–${fromISO(sun).getDate()} ${MON[fromISO(sun).getMonth()]}</h2>
      <div class="wk-nav"><button class="icon-btn" id="wPrev" aria-label="Предыдущая неделя">${I.chevL}</button><button class="icon-btn" id="wNext" aria-label="Следующая неделя"${statsOffset >= 0 ? " disabled" : ""}>${I.chevR}</button></div>`;
    col.appendChild(head);
    head.querySelector("#wPrev").onclick = () => { statsOffset--; render(); };
    head.querySelector("#wNext").onclick = () => { if (statsOffset < 0) { statsOffset++; render(); } };

    const log = S.log.filter((e) => inWeek(e.d));
    const total = log.reduce((s, e) => s + e.ms, 0);
    const finished = log.filter((e) => e.f).length;
    const lastDay = statsOffset === 0 ? today : sun;
    let hPossible = 0, hDone = 0;
    for (let d = mon; d <= lastDay; d = addDays(d, 1)) S.habits.forEach((h) => { if (habitApplies(h, d)) { hPossible++; if (habitDone(h.id, d)) hDone++; } });
    const sleeps = Object.entries(S.sleep).filter(([d]) => inWeek(d)).map(([d, s]) => ({ d, ...s, ms: s.wake - s.bed })).filter((s) => s.ms > 0 && s.ms < 20 * 3600e3);
    const avgSleep = sleeps.length ? sleeps.reduce((s, x) => s + x.ms, 0) / sleeps.length : 0;
    const tiles = document.createElement("div"); tiles.className = "tiles";
    tiles.innerHTML = [[total ? durShort(total) : "0", "по таймерам"], [finished, "задач закрыто таймером"], [hPossible ? Math.round(hDone / hPossible * 100) + "%" : "—", "привычек выполнено"], [avgSleep ? durShort(avgSleep) : "—", "сон в среднем"]]
      .map(([b, s]) => `<div class="tile"><b>${b}</b><span>${s}</span></div>`).join("");
    col.appendChild(tiles);

    // time by project
    const byP = {};
    log.forEach((e) => { byP[e.p || ""] = (byP[e.p || ""] || 0) + e.ms; });
    const rows = Object.entries(byP).sort((a, b) => b[1] - a[1]);
    const pc = document.createElement("div"); pc.className = "card";
    pc.innerHTML = `<div class="card-h"><h2 class="card-t">Куда ушло время</h2></div>`;
    if (!rows.length) pc.innerHTML += `<div class="empty">Запускай задачи с таймером, и здесь появится, сколько времени ушло на каждый проект.</div>`;
    const max = rows.length ? rows[0][1] : 1;
    rows.forEach(([pid, ms]) => {
      const p = proj(pid);
      const name = pid === "_routine" ? "Рутины" : p ? p.name : "Без проекта";
      const color = pid === "_routine" ? "violet" : p ? p.color : "gray";
      const r = document.createElement("div"); r.className = "brow";
      r.innerHTML = `<span class="bl">${esc(name)}</span><span class="bt"><i class="pc-${color}" style="width:${Math.max(3, ms / max * 100)}%;background:var(--pc-${color})"></i></span><span class="bv">${durShort(ms)}</span>`;
      pc.appendChild(r);
    });
    col.appendChild(pc);

    // habits
    const hc = document.createElement("div"); hc.className = "card";
    hc.innerHTML = `<div class="card-h"><h2 class="card-t">Привычки</h2></div>`;
    S.habits.forEach((h) => {
      let pos = 0, dn = 0;
      for (let d = mon; d <= lastDay; d = addDays(d, 1)) if (habitApplies(h, d)) { pos++; if (habitDone(h.id, d)) dn++; }
      const r = document.createElement("div"); r.className = "brow";
      r.innerHTML = `<span class="bl">${esc(h.name)}</span><span class="bt"><i style="width:${pos ? dn / pos * 100 : 0}%;background:var(--done)"></i></span><span class="bv">${dn} из ${pos}</span>`;
      hc.appendChild(r);
    });
    col.appendChild(hc);

    // sleep
    const sc = document.createElement("div"); sc.className = "card";
    sc.innerHTML = `<div class="card-h"><h2 class="card-t">${I.moon}Сон</h2><span class="sum">записывается сам: закрыл день → начал утро</span></div>`;
    if (!sleeps.length) sc.innerHTML += `<div class="empty">Пока нет ночей. Закрой день кнопкой «Пора завершать этот день», а утром начни утро.</div>`;
    const sl = document.createElement("div");
    sleeps.sort((a, b) => a.d < b.d ? -1 : 1).forEach((s) => {
      const r = document.createElement("div"); r.className = "srow";
      const good = s.ms >= 7 * 3600e3;
      r.innerHTML = `<span class="sd">${WD[fromISO(s.d).getDay()]} ${fromISO(s.d).getDate()}</span><span>${clock(s.bed)} → ${clock(s.wake)}</span><span class="sv" style="color:var(${good ? "--good-ink" : "--over-ink"})">${durShort(s.ms)}</span>`;
      sl.appendChild(r);
    });
    sc.appendChild(sl);
    col.appendChild(sc);
    el.appendChild(col);
  }

  // ---------- drag: long-press on touch, grab-and-move with a mouse ----------
  let drag = null, suppressClick = false;
  document.addEventListener("click", (e) => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  function enableDrag(ul) {
    ul.addEventListener("contextmenu", (e) => { if (e.target.closest("li.task.live")) e.preventDefault(); });
    ul.addEventListener("touchmove", (e) => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
    ul.addEventListener("pointerdown", (e) => {
      if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
      const li = e.target.closest("li.task"); if (!li || !li.dataset.id) return;
      const handle = e.target.closest(".handle");
      if (!handle && (editing || e.target.closest("input, select"))) return;
      drag = { ul, li, pid: e.pointerId, sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY, y0: e.clientY + window.scrollY, active: false, timer: null, raf: 0, mouse: e.pointerType === "mouse" };
      if (handle) { e.preventDefault(); beginDrag(); }
      else if (drag.mouse) e.preventDefault();
      else drag.timer = setTimeout(beginDrag, 380);
    });
  }
  function beginDrag() {
    if (!drag) return;
    const sy = window.scrollY, key = drag.ul._key;
    const cands = isRoutine(key) ? [drag.ul] : [...document.querySelectorAll("ul.tl")].filter((u) => u._key === "today" || u._key === "tomorrow");
    drag.zones = cands.filter((u) => u.getBoundingClientRect().width > 0).map((u) => {
      const items = [...u.querySelectorAll(":scope > li.task")], ur = u.getBoundingClientRect();
      return { ul: u, key: u._key, items, left: ur.left, right: ur.right, top: ur.top + sy, bottom: ur.bottom + sy, rects: items.map((el) => { const r = el.getBoundingClientRect(); return { top: r.top + sy, h: r.height }; }) };
    });
    drag.src = drag.zones.find((z) => z.ul === drag.ul);
    if (!drag.src) { drag = null; return; }
    drag.from = drag.to = drag.src.items.indexOf(drag.li);
    drag.target = drag.src; drag.multi = drag.zones.length > 1; drag.active = true;
    suppressClick = true;
    drag.li.classList.add("dragging");
    document.body.style.userSelect = "none"; document.body.style.cursor = "grabbing";
    try { navigator.vibrate && navigator.vibrate(12); } catch {}
    const loop = () => {
      if (!drag || !drag.active) return;
      const edge = 70, H = window.innerHeight;
      if (drag.py < edge) window.scrollBy(0, -Math.ceil((edge - drag.py) / 6));
      else if (drag.py > H - edge) window.scrollBy(0, Math.ceil((drag.py - (H - edge)) / 6));
      layoutDrag(); drag.raf = requestAnimationFrame(loop);
    };
    layoutDrag(); drag.raf = requestAnimationFrame(loop);
  }
  function layoutDrag() {
    const d = drag, src = d.src, r = src.rects[d.from], sy = window.scrollY;
    const dy = d.py + sy - d.y0, dx = d.multi ? d.px - d.sx : 0;
    d.li.style.transform = `translate(${dx}px, ${dy}px) scale(1.02)`;
    const center = r.top + r.h / 2 + dy, shift = r.h + 8, ppy = d.py + sy;
    let tgt = src;
    if (d.multi) for (const z of d.zones) if (z !== src && d.px >= z.left - 16 && d.px <= z.right + 16 && ppy >= z.top - 40 && ppy <= z.bottom + 40) tgt = z;
    let to;
    if (tgt === src) {
      to = d.from;
      src.rects.forEach((rr, i) => {
        if (i === d.from) return;
        const mid = rr.top + rr.h / 2; let t = 0;
        if (i > d.from && center > mid) { t = -shift; to = Math.max(to, i); }
        if (i < d.from && center < mid) { t = shift; to = Math.min(to, i); }
        src.items[i].style.transform = t ? `translateY(${t}px)` : "";
      });
    } else {
      src.items.forEach((el, i) => { if (i !== d.from) el.style.transform = i > d.from ? `translateY(${-shift}px)` : ""; });
      to = tgt.rects.filter((rr) => rr.top + rr.h / 2 < ppy).length;
    }
    for (const z of d.zones) {
      if (z !== src) z.items.forEach((el, i) => { el.style.transform = z === tgt && i >= to ? `translateY(${shift}px)` : ""; });
      z.ul.classList.toggle("drop-target", z !== src && z === tgt);
    }
    d.target = tgt; d.to = to;
  }
  function endDrag() {
    if (!drag) return;
    const d = drag; drag = null;
    clearTimeout(d.timer); cancelAnimationFrame(d.raf);
    document.body.style.userSelect = ""; document.body.style.cursor = "";
    if (!d.active) return;
    const key = d.src.key;
    const item = isRoutine(key) ? itemsOf(key)[d.from] : findItem(d.li.dataset.id)?.t;
    if (item) {
      if (isRoutine(key)) { if (d.to !== d.from) { const arr = S.routines[key]; arr.splice(d.from, 1); arr.splice(d.to, 0, item); persist(); } }
      else if (!(d.target === d.src && d.to === d.from)) {
        const tk = d.target.key;
        const vis = (d.target.ul._ids || []).filter((x) => x !== item.id);
        const full = itemsOf(tk).filter((x) => x !== item);
        const before = d.to < vis.length ? full.indexOf(S.tasks.find((x) => x.id === vis[d.to])) : -1;
        if (d.target !== d.src) { item.done = false; item.spent = 0; }
        moveTask(item, tk, before >= 0 ? before : null);
        persist();
      }
    }
    render();
    setTimeout(() => { suppressClick = false; }, 60);
  }
  window.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.active) {
      const dist = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
      if (drag.mouse) { if (dist > 5) { drag.px = e.clientX; drag.py = e.clientY; beginDrag(); } }
      else if (dist > 8) endDrag();
      return;
    }
    drag.px = e.clientX; drag.py = e.clientY; e.preventDefault();
  }, { passive: false });
  window.addEventListener("pointerup", (e) => { if (drag && e.pointerId === drag.pid) endDrag(); });
  window.addEventListener("pointercancel", (e) => { if (drag && e.pointerId === drag.pid) endDrag(); });

  // ---------- sound: GM-style door chime ----------
  const chime = new Audio(makeChime()); chime.preload = "auto";
  let unlocked = false, ringTimer = null, rings = 0;
  function makeChime() {
    const sr = 22050, gap = 0.55, count = 6, n = Math.floor(sr * gap * count), data = new Float32Array(n), f = 830;
    for (let k = 0; k < count; k++) {
      const s0 = Math.floor(k * gap * sr);
      for (let i = s0; i < n; i++) {
        const t = (i - s0) / sr; if (t > 0.6) break;
        const env = Math.min(1, t / 0.003) * Math.exp(-t / 0.15);
        data[i] += env * (0.7 * Math.sin(2 * Math.PI * f * t) + 0.2 * Math.sin(2 * Math.PI * f * 2 * t) * Math.exp(-t / 0.06) + 0.07 * Math.sin(2 * Math.PI * f * 3 * t) * Math.exp(-t / 0.04));
      }
    }
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, data[i] * 0.8)) * 32767, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }
  function unlockSound() {
    if (unlocked) return;
    chime.muted = true;
    const p = chime.play();
    if (p && p.then) p.then(() => { chime.pause(); chime.currentTime = 0; chime.muted = false; unlocked = true; }).catch(() => { chime.muted = false; });
  }
  function ring() {
    stopRing(); rings = 0;
    const once = () => { try { chime.muted = false; chime.currentTime = 0; const p = chime.play(); if (p && p.catch) p.catch(() => {}); } catch {} if (++rings >= 6) stopRing(); };
    once(); ringTimer = setInterval(once, 3300);
  }
  function stopRing() { clearInterval(ringTimer); ringTimer = null; try { chime.pause(); } catch {} }

  // ---------- wake lock ----------
  let lock = null;
  async function syncWake() {
    const need = !!T || !$("night").hidden;
    try {
      if (need && !lock && "wakeLock" in navigator && document.visibilityState === "visible") { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); }
      else if (!need && lock) { lock.release(); lock = null; }
    } catch {}
  }

  // ---------- timer ----------
  let T = lsGet(LS_TIMER), tick = null, lastMode = "";
  function startTimer(id) {
    const f = findItem(id); if (!f || !f.t.min) return;
    unlockSound();
    T = { id, total: f.t.min * 60000, endsAt: Date.now() + f.t.min * 60000, remaining: null, finished: false, finishedAt: null, elapsedBefore: 0, mini: false };
    lsSet(LS_TIMER, T); openTimer();
  }
  function showTimerView() {
    const mini = !!T.mini;
    $("timer").hidden = mini; $("mini").hidden = !mini;
    document.body.classList.toggle("has-mini", mini);
    document.body.style.overflow = mini ? "" : "hidden";
  }
  function openTimer() { showTimerView(); syncWake(); clearInterval(tick); tick = setInterval(update, 250); update(true); }
  function closeTimer(silent) {
    stopRing(); clearInterval(tick); tick = null; T = null; lsSet(LS_TIMER, null);
    $("timer").hidden = true; $("timer").classList.remove("ringing"); $("mini").hidden = true; document.body.classList.remove("has-mini");
    document.body.style.overflow = $("night").hidden ? "" : "hidden";
    syncWake(); if (!silent) render();
  }
  const remaining = () => !T ? 0 : T.endsAt == null ? T.remaining : Math.max(0, T.endsAt - Date.now());
  const fmt = (ms) => { const s = Math.ceil(ms / 1000); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); };
  const fmtUp = (ms) => { const s = Math.floor(ms / 1000); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); };
  function spentMs() {
    if (!T) return 0;
    const base = T.elapsedBefore || 0;
    if (T.finished) return base + T.total + Math.max(0, Date.now() - (T.finishedAt || Date.now()));
    return base + T.total - remaining();
  }
  function update(force) {
    if (!T) return;
    const f = findItem(T.id), rem = remaining();
    if (!T.finished && rem <= 0) {
      T.finishedAt = T.endsAt || Date.now(); T.finished = true; T.endsAt = null; T.remaining = 0;
      if (T.mini) { T.mini = false; showTimerView(); }
      lsSet(LS_TIMER, T); ring();
    }
    const name = f ? f.t.name : "Задача";
    const overMs = T.finished ? Math.max(0, Date.now() - (T.finishedAt || Date.now())) : 0;
    const txt = T.finished ? "+" + fmtUp(overMs) : fmt(rem);
    const mode = T.finished ? "done" : (T.endsAt == null ? "paused" : "run");
    if (T.mini) { $("miniName").textContent = name; $("miniTime").textContent = txt; $("miniTime").classList.toggle("paused", mode === "paused"); return; }
    $("tName").textContent = name;
    const tn = f ? f.t.note : ""; $("tNote").textContent = tn || ""; $("tNote").hidden = !tn;
    $("tCount").innerHTML = [...txt].map((ch) => `<span${ch === ":" ? ' class="colon"' : ch === "+" ? ' class="plus"' : ""}>${ch}</span>`).join("");
    $("tPrg").setAttribute("stroke-dashoffset", (C * (1 - rem / T.total)).toFixed(2));
    $("timer").classList.toggle("ringing", T.finished);
    $("tMin").style.visibility = T.finished ? "hidden" : "";
    const p = f && !isRoutine(f.key) ? proj(f.t.project) : null;
    $("tLabel").textContent = T.finished ? "Время вышло" : (p ? p.name + " · " : "") + Math.round(T.total / 60000) + " мин";
    $("tStatus").textContent = mode === "paused" ? "На паузе" : (mode === "done" ? "Идёт овертайм. Жми «Готово», когда закончишь" : "");
    if (mode !== lastMode || force) { lastMode = mode; renderControls(mode, f && !isRoutine(f.key)); }
  }
  function btn(label, cls, fn) { const b = document.createElement("button"); b.className = cls; b.textContent = label; b.onclick = fn; return b; }
  function renderControls(mode, isTask) {
    const box = $("tControls"); box.innerHTML = "";
    if (mode === "done") box.append(btn("+5 мин", "btn", () => addTime(5)), btn("Готово ✓", "btn primary", () => finish(true)));
    else box.append(mode === "paused" ? btn("Продолжить", "btn", resume) : btn("Пауза", "btn", pause), btn("+1 мин", "btn", () => addTime(1)), btn("Готово ✓", "btn primary", () => finish(true)));
    if (isTask) box.append(btn("Продолжу позже: сохранить время как сессию", "later", () => finish(false)));
  }
  function pause() { T.remaining = remaining(); T.endsAt = null; lsSet(LS_TIMER, T); update(); }
  function resume() { unlockSound(); T.endsAt = Date.now() + T.remaining; T.remaining = null; lsSet(LS_TIMER, T); update(); }
  function addTime(min) {
    stopRing(); const add = min * 60000;
    if (T.finished) { T.elapsedBefore = spentMs(); T.finished = false; T.finishedAt = null; T.total = add; T.endsAt = Date.now() + add; T.remaining = null; }
    else if (T.endsAt == null) { T.remaining += add; T.total += add; }
    else { T.endsAt += add; T.total += add; }
    lsSet(LS_TIMER, T); update(true);
  }
  function finish(done) {
    const f = findItem(T.id), ms = Math.round(spentMs());
    if (f) {
      const routine = isRoutine(f.key), t = f.t;
      S.log.push({ d: dayISO(), p: routine ? "_routine" : (t.project || ""), ms, n: t.name, f: done });
      if (S.log.length > 800) S.log = S.log.slice(-800);
      if (done) { t.done = true; t.spent = (t.acc || 0) + ms; if (!routine) t.doneAt = Date.now(); }
      else { t.acc = (t.acc || 0) + ms; t.sessions = (t.sessions || 0) + 1; }
      persist();
    }
    closeTimer();
    if (f && done) maybeCloseDay(f.key);
  }
  $("tClose").onclick = () => closeTimer();
  $("tMin").onclick = () => { T.mini = true; lsSet(LS_TIMER, T); showTimerView(); update(true); };
  $("mini").onclick = () => { T.mini = false; lsSet(LS_TIMER, T); showTimerView(); update(true); };

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { syncWake(); if (T) update(); if (S.day.closedAt) checkDay(); render(); }
  });

  render();
  if (T && findItem(T.id)) openTimer(); else { T = null; lsSet(LS_TIMER, null); }
  checkDay();
})();
</script>
