<style>

 --pc-blue-bg:#DFEAFC;--pc-blue:#1F5BB8;--pc-green-bg:#DCF1E3;--pc-green:#17693F;
 --pc-aqua-bg:#D8F2F2;--pc-aqua:#0F6B6B;--pc-gray-bg:#E7E9EE;--pc-gray:#4B5263;}
@media (prefers-color-scheme:dark){:root{--bg:#0F1116;--surface:#191C24;--surface-2:#14171E;--ink:#EEF0F5;--muted:#8C93A5;--line:#272B36;
 --accent:#FF6E35;--done:#36C383;
 --pc-orange-bg:#3A2116;--pc-orange:#FF9F6E;--pc-red-bg:#3A1A18;--pc-red:#FF8F86;
 --pc-yellow-bg:#352B12;--pc-yellow:#F2C14E;--pc-violet-bg:#2A2142;--pc-violet:#B9A3FF;
 --pc-blue-bg:#172840;--pc-blue:#8DB8FF;--pc-green-bg:#13301F;--pc-green:#6FD49B;
 --pc-aqua-bg:#11302F;--pc-aqua:#6ED6D3;--pc-gray-bg:#262A33;--pc-gray:#A9B0C0;color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif;
 padding:16px 14px calc(28px + env(safe-area-inset-bottom));max-width:1180px;margin-inline:auto}
h1{font-size:26px;margin:0 0 2px;letter-spacing:-.02em}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.vsw{margin:0;flex-wrap:nowrap;flex-shrink:0}

 font-weight:800;font-size:12px;color:var(--muted);text-decoration:none}
.vsw a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:13px;
 padding:8px 15px;border-radius:999px;cursor:pointer;min-height:38px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
 /* закреплённое меню (комп): всегда сверху при прокрутке */
@media(min-width:481px){#stk{position:sticky;top:var(--dnbh,0px);z-index:40;background:var(--bg);padding:8px 0 0;margin:0 0 10px;box-shadow:0 1px 0 var(--line)}#stk .bar{margin-bottom:8px!important}}
.scflt{display:flex;gap:6px;margin:0 0 10px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.bar .seg{margin-bottom:0}
.seg .ico{display:inline-flex;align-items:center;justify-content:center;padding:7px 11px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#envSeg[hidden]{display:none}
.hint{color:var(--muted);font-size:12px;margin:0 0 12px}
/* ---------- одна карточка ---------- */
.card{display:flex;align-items:center;gap:10px;min-width:0;background:var(--surface);border:1px solid var(--line);
 border-radius:16px;padding:10px 12px;margin-bottom:7px;min-height:56px}
.card.done{opacity:.55}
.card{position:relative;flex-wrap:wrap}
.card.v{flex-wrap:nowrap}
.card .nm{display:inline-block;max-width:100%;cursor:text;vertical-align:top}
.card .txt{cursor:pointer}
.nmi{width:100%;font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--accent);border-radius:8px;padding:2px 6px}
.card .x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
 color:var(--muted);font-size:10px;line-height:1;cursor:pointer;padding:0;opacity:0;transition:opacity .12s;z-index:2}
@media (hover:hover){.card:hover>.x{opacity:1}}
.panel{flex:0 0 100%;width:100%;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;display:flex;flex-direction:column;gap:10px;cursor:default}
.card.dragging{opacity:.3}
.col.dropcol{outline:2px dashed var(--accent);outline-offset:-2px}
.kb .col h3 .clr{margin-left:auto;border:0;background:transparent;color:var(--cink,var(--muted));font:inherit;font-weight:800;font-size:11px;cursor:pointer;opacity:.8;padding:2px 4px}
.kb .col h3 .clr:hover{opacity:1;text-decoration:underline}
.card.ghost{position:fixed;z-index:90;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:.95;margin:0}
.dropline{position:fixed;height:3px;border-radius:2px;background:var(--accent);z-index:91;pointer-events:none}
body.drag{user-select:none;-webkit-user-select:none;cursor:grabbing}
.card{-webkit-touch-callout:none}
.panel .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.panel .plb{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.panel textarea{width:100%;min-height:58px;resize:vertical;font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.panel input[type=number],.panel input[type=time],.panel input[type=date],.panel .clt,.panel .cl-new,.panel .sub-new{font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
.panel input[type=number]{width:70px}
.chipb{border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:800;font-size:12px;background:transparent;color:var(--ink);cursor:pointer}
.chipb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cktag{border:0;background:transparent;font:inherit;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;padding:1px 6px;border-radius:8px}
.cktag:hover,.cktag.on{background:var(--surface-2);color:var(--ink)}
.card>.cklist{flex:0 0 100%;display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid var(--line)}
.ckrow{display:flex;align-items:center;gap:8px;font-size:13px}.ckrow.done span{text-decoration:line-through;color:var(--muted)}
body.drag .card .plus{opacity:1}
.plus.dropplus{background:var(--accent)!important;color:#fff!important;transform:scale(1.35)}
.card.stackt{margin-top:12px;box-shadow:0 -7px 0 -3px color-mix(in srgb,var(--accent) 34%,var(--surface)),0 -13px 0 -6px color-mix(in srgb,var(--accent) 50%,var(--surface))}
.card.stack.stackt{box-shadow:0 7px 0 -3px color-mix(in srgb,var(--accent) 34%,var(--surface)),0 13px 0 -6px color-mix(in srgb,var(--accent) 50%,var(--surface)),0 -7px 0 -3px color-mix(in srgb,var(--accent) 34%,var(--surface)),0 -13px 0 -6px color-mix(in srgb,var(--accent) 50%,var(--surface))}
.radd{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:12px;padding:6px 4px;cursor:pointer;border-radius:8px}
.radd:hover{background:var(--surface-2)}
.evb{display:flex;justify-content:space-between;align-items:center;width:100%;margin:14px 0 4px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(135deg,#1d2140,#2b2358);color:#e9e6ff;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
#dnb{position:fixed;right:16px;top:96px;z-index:45;width:230px;background:#1d1d1f;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
#dnb.late{background:#712B13}#dnb .dr+.dr{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}
#dnb .dx{position:absolute;right:8px;top:6px;width:24px;height:24px;border-radius:7px;border:0;background:transparent;color:rgba(255,255,255,.7);font-size:18px;line-height:1;cursor:pointer}
#dnb .dl{font-size:12px;font-weight:700;color:rgba(255,255,255,.65);padding-right:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dnb .dt{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin:2px 0 4px;font-variant-numeric:tabular-nums}
#dnb .dr.late .dt,#dnb .dr.late .dl{color:#ff9f86}
#dnb .ds{font-size:12.5px;font-weight:600;line-height:1.35;color:rgba(255,255,255,.85)}
#dnb .dgo{margin:8px 0 0;width:100%;font-size:13px;padding:9px 10px}
#dnb.min{width:auto;padding:7px 12px;border-radius:999px;cursor:pointer}#dnb.min .dx{display:none}#dnb .dm{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
@media(max-width:480px){#dnb:not(.min){left:8px;right:8px;top:calc(6px + env(safe-area-inset-top));width:auto;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 16px}
 #dnb:not(.min) .dr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;flex:1 1 100%}#dnb:not(.min) .dr+.dr{margin-top:0;padding-top:6px}
 #dnb:not(.min) .dl{padding-right:0;flex:1 1 auto;min-width:0}#dnb:not(.min) .dt{font-size:22px;margin:0}#dnb:not(.min) .ds{flex:1 1 100%}
 #dnb.min{top:calc(8px + env(safe-area-inset-top));right:8px}}
.evb .cd{font-variant-numeric:tabular-nums;opacity:.85}
.card.sel{outline:2px solid var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.gcount{position:absolute;right:-8px;top:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 8px 28px rgba(0,0,0,.25);font-weight:800;font-size:13px}
.fab{position:fixed;right:0;top:45%;z-index:60;display:flex;flex-direction:column;gap:8px}
.fab button{width:40px;height:38px;display:grid;place-items:center;text-align:center;border:1px solid var(--line);border-right:0;background:var(--surface);color:var(--ink);font:inherit;font-weight:800;font-size:12px;padding:0;border-radius:12px 0 0 12px;cursor:pointer;opacity:.85}
.fab button.ok{background:var(--ink);color:var(--surface);opacity:1}
.fab button:hover{opacity:1}
#fbdock{position:fixed;right:56px;bottom:12px;z-index:80;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:12px;pointer-events:none}
#fbdock>*{pointer-events:auto}
.fbpop{width:340px;max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 12px 36px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px}
.fbh{display:flex;justify-content:space-between;align-items:center}.fbx{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.fbta{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px;padding:8px;resize:vertical}
.fbctx{font-size:11px;color:var(--muted)}
.fbls[hidden],.fbpast[hidden]{display:none!important}
.fbls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.fbls li{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px;position:relative}
.fbls li i{font-size:11px;color:var(--muted);font-style:normal}.fbls li button{position:absolute;right:6px;top:4px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.fblog{font-size:11px;color:var(--muted)}.fblog pre{white-space:pre-wrap;margin:4px 0 0;font-size:11px}
.fbf{display:flex;gap:8px;align-items:center}.fbex{font-weight:800}.fbst{font-size:12px;color:var(--muted)}
.lasso{position:fixed;z-index:75;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);pointer-events:none;border-radius:6px}
body.lassoing{user-select:none;-webkit-user-select:none}
.pfoot{display:flex;align-items:center;justify-content:space-between}
.dtbtn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:3px 6px;border-radius:8px;cursor:pointer;opacity:.7}
.dtbtn.set{opacity:1}
.dtbtn:hover{background:var(--surface-2)}
.dtbox{flex-wrap:wrap;gap:6px;align-items:center}
.dtp{display:block;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px;background:var(--surface)}
.dtp-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.dtp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;text-transform:capitalize}
.dtp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dtp-grid .dh{font-size:11px;color:var(--muted);text-align:center}
.dtp-grid .dd{border:0;background:transparent;color:inherit;font:inherit;font-size:13px;padding:5px 0;border-radius:50%;cursor:pointer}
.dtp-grid .dd.o{color:var(--muted);opacity:.6}.dtp-grid .dd.tdy{outline:1px solid var(--line)}
.dtp-grid .dd:hover{background:var(--surface-2)}.dtp-grid .dd.s{background:var(--accent);color:#fff}
.dtp-slots{display:flex;flex-direction:column;gap:4px;max-height:210px;overflow:auto}
.dts{border:1px solid var(--line);background:var(--surface-2);color:inherit;font:inherit;font-size:13px;padding:4px 0;border-radius:8px;cursor:pointer}
.dts.s{background:var(--accent);border-color:var(--accent);color:#fff}.dts.busy{color:var(--muted);text-decoration:line-through}
.dtp-bot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.dtp-parts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}.dtp-bot .ptime{width:70px}@media(max-width:480px){.dtp-bot .ptime{flex:1;min-width:120px}}.dtp-ap{margin-left:auto;background:var(--accent);color:#fff;border-color:var(--accent)}

 .seg button{padding:8px 10px;font-size:12.5px}
 body{padding:10px 12px calc(76px + env(safe-area-inset-bottom))}

<script>
var qrcode = function() {

          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

      var minLostPoint = 0;
      var pattern = 0;
      for (var i = 0; i < 8; i += 1) {
        makeImpl(true, i);
        var lostPoint = QRUtil.getLostPoint(_this);
        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }
      return pattern;
    };
    var setupTimingPattern = function() {
      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }
      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };
    var setupPositionAdjustPattern = function() {
      var pos = QRUtil.getPatternPosition(_typeNumber);
      for (var i = 0; i < pos.length; i += 1) {
        for (var j = 0; j < pos.length; j += 1) {
          var row = pos[i];
          var col = pos[j];
          if (_modules[row][col] != null) {
            continue;
          }
          for (var r = -2; r <= 2; r += 1) {
            for (var c = -2; c <= 2; c += 1) {
              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };
    var setupTypeNumber = function(test) {
      var bits = QRUtil.getBCHTypeNumber(_typeNumber);
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;

      var byteIndex = 0;

              bitIndex -= 1;

                byteIndex += 1;
                bitIndex = 7;

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var index = 0;
      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }
      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }
      return data;
    };
    var createData = function(typeNumber, errorCorrectionLevel, dataList) {
      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }
      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }
      while (true) {
        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);
        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }
      return createBytes(buffer, rsBlocks);
    };
    _this.addData = function(data, mode) {
      mode = mode || 'Byte';
      var newData = null;

      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }
      _dataList.push(newData);
      _dataCache = null;
    };
    _this.isDark = function(row, col) {

      }
      return _modules[row][col];
    };
    _this.getModuleCount = function() {
      return _moduleCount;
    };

          var buffer = qrBitBuffer();
          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }
          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

            break;
          }

      }
      makeImpl(false, getBestMaskPattern() );

      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

      for (r = 0; r < _this.getModuleCount(); r += 1) {

<script>

const esc=(s)=>String(s==null?"":s);

/* ---------- база: одна задача, одна форма (ARCHITECTURE.md §4) ---------- */
function task(src,over){
  return Object.assign({
    id:String(src.id||Math.random().toString(36).slice(2)),
    name:String(src.name||""), desc:String(src.note||src.desc||""),
    check:Array.isArray(src.check)?src.check:[],
    type:"дела", project:src.project||"", routine:"",
    where:src.where||"", ord:0,
    at:src.at||"", due:src.due||"", min:Number(src.min)||0,
    spent:+src.spent||0, sessions:+src.sessions||0, acc:+src.acc||0,
    done:!!src.done, doneAt:+src.doneAt||0, tm:null, archived:false,
    status:src.done?"done":"", stage:"", waitUntil:src.waitUntil||"",
    link:src.link||"", rel:src.rel||"",
  },over);
}
function migrate(v1){
  const out=[], add=(t)=>{t.ord=out.length;out.push(t)};
  (v1.tasks||[]).forEach((t)=>add(task(t,{type:"дела",where:t.where||"today"})));
  ["morning","evening"].forEach((k)=>((v1.routines||{})[k]||[]).forEach((t)=>add(task(t,{type:"дела",routine:k,where:"today"}))));
  ((v1.work||{}).tasks||[]).forEach((t)=>add(task(t,{type:"работа",status:t.status||"",stage:t.stage||"",
    where:"",link:t.parent||"",rel:t.parent?"post":""})));
  const pj=(v1.projects||[]).map((p)=>({id:p.id,name:p.name,color:p.color||"gray",type:p.kind==="work"?"работа":"дела"}))
    .concat(((v1.work||{}).projects||[]).map((p)=>({id:p.id,name:p.name,color:p.color||"gray",type:"работа"})));

}

let S=null;
const UI=(()=>{const u={sys:"дела",env:"list",view:"tasks"},r=read("lifeos.v2b.ui")||{};if(["tasks","habits","stats","plan","scen","map"].includes(r.view))u.view=r.view;
  if(r.sys==="дела"||r.sys==="работа")u.sys=r.sys;if(["list","kanban","timeline","calendar"].includes(r.env))u.env=r.env;return u})();

  status:[["","Не начато"],["todo","В работу"],["doing","В работе"],["wait","Жду"],["done","Готово"]],
};
const proj=(id)=>{const p=S.projects.find((x)=>x.id===id)||null;return p&&p.type===UI.sys&&(UI.sys==="работа"||!/^работа$/i.test(p.name))?p:null};
const mine=()=>S.tasks.filter((t)=>t.type===UI.sys&&!t.routine&&(CORE.show||!t.tpl));   /* рутины живут в своих группах «Утро»/«Вечер» */

/* ---------- одна карточка на все окружения ---------- */
/* общие кусочки карточки: считаются один раз, окружение только выбирает, где их поставить */
const CKS=new Set(read("lifeos.v2b.ckshow")||[]);
const saveCks=()=>{try{localStorage.setItem("lifeos.v2b.ckshow",JSON.stringify([...CKS]))}catch{}};

  b.onclick=(e)=>{e.stopPropagation();if(CKS.has(t.id))CKS.delete(t.id);else CKS.add(t.id);saveCks();render()};return b}
function ckList(t){const w=el("div","cklist");
  t.check.forEach((c)=>{const r=el("div","ckrow"+(c.done?" done":""));const cb=el("input");cb.type="checkbox";cb.checked=!!c.done;
    cb.onclick=(e)=>e.stopPropagation();cb.onchange=()=>{pushUndo();c.done=cb.checked;save();render()};
    r.append(cb,el("span",null,c.text||c.t||c.name||""));w.appendChild(r)});return w}
const DESCX=new Set(read("lifeos.v2b.descx")||[]);

  const g=d.parentNode&&d.parentNode.querySelector('.dtag[data-did="'+d.dataset.did+'"]');if(!g)return;
  g.hidden=!(d.classList.contains("open")||d.scrollHeight>d.clientHeight+1)})}
const checkTxt=(t)=>t.check&&t.check.length?t.check.filter((c)=>c.done).length+"/"+t.check.length+" ✓":"";
/* сколько осталось до времени начала: серенький текст слева от кнопки времени («через 39 мин»; прошло — «опоздание 10 мин»).
   Только задачи на сегодня со временем, не выполненные и не запущенные. На таймлайне время видно по позиции, в календаре места нет. */
function startDelta(t){   /* мс до времени начала сегодняшней задачи (меньше нуля — опоздание); null — не подходит */
  if(!t||!t.at||t.done||t.tm||t.archived)return null;
  const [y,m,d]=dayOf(NOW()).split("-").map(Number);
  const key=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  if(!(t.due===key||(!t.due&&t.where==="today")))return null;
  const [hh,mm]=t.at.split(":").map(Number);if(!(hh>=0&&mm>=0))return null;
  return new Date(y,m-1,d+(hh<4?1:0),hh,mm,0,0).getTime()-NOW()}
function untilInfo(t){
  const dl=startDelta(t);if(dl===null)return null;
  const mins=Math.ceil(dl/60000);
  const fm=(n)=>n<60?n+" мин":Math.floor(n/60)+" ч"+(n%60?" "+(n%60)+" мин":"");
  if(mins>180||mins<-720)return null;
  if(mins>0)return {txt:"через "+fm(mins),late:false};
  if(mins===0)return {txt:"сейчас",late:false};
  return {txt:"опоздание "+fm(-mins),late:true}}

  if(opt&&opt.noAt)return null;
  const u=untilInfo(t);if(!u)return null;
  const sp=el("span","at cdn"+(u.late?" late":""),u.txt);sp.dataset.cd=t.id;sp.title="До времени начала ("+t.at+")";return sp}

  const u=untilInfo(byId(n.dataset.cd));if(!u){n.remove();return}
  if(n.textContent!==u.txt)n.textContent=u.txt;n.classList.toggle("late",u.late)})}
setInterval(refreshCdn,20000);
function pillBtn(t,cls,title){const pl=el("button","mins"+cls,"");pl.type="button";if(title)pl.title=title;pl.dataset.tid=t.id;wirePill(pl,t);return pl}
function cardBase(t,opt={}){
  const li=el("div","card"+(t.done?" done":"")+(t.carry&&!t.done&&t.where==="today"?" carry":""));
  const ck=el("button","ck",t.done?"✓":"");ck.setAttribute("aria-label","Отметить");
  ck.onclick=(e)=>{e.stopPropagation();pushUndo();if(t.done){t.done=false;if(t.type==="работа")t.status="todo";save();render()}else complete(t)};
  li.appendChild(ck);
  const txt=el("div","txt"); txt.appendChild(el("span","nm",t.name||"Без названия"));
  const meta=el("div","meta"); const p=proj(t.project);
  if(t.carry&&!t.done&&t.where==="today")meta.appendChild(el("span","carrytag","со вчера"));
  if(t.type==="дела"&&t.where==="backlog"&&t.col&&!t.done){const cc=(S.cols||[]).find((x)=>x.id===t.col);if(cc)meta.appendChild(el("span","chip pc-gray",cc.name))}
  if(p&&!opt.noProject){const c=el("span","chip pc-"+p.color,p.name);meta.appendChild(c)}
  if(checkTxt(t)&&!opt.v)meta.appendChild(ckTag(t));
  if(t.tpl&&!t.link)meta.appendChild(el("span","chip pc-gray","⚙ ядро"));
  const kids=S.tasks.filter((x)=>x.link===t.id).length;
  if(kids)meta.appendChild(el("span","subn",kids+" подзадач"+(kids===1?"а":"и")));
  if(t.desc){const d=el("span","desc"+(DESCX.has(t.id)?" open":""),t.desc);d.dataset.did=t.id;meta.appendChild(d);

let BOT_T=null,BOT_LAST={};
const botItems=(sc,ver)=>S.tasks.filter((t)=>t.type==="сценарий"&&t.sc===sc.id&&t.sv===ver.id&&!t.link).sort((a,b)=>(a.ord||0)-(b.ord||0)).map((t)=>({id:t.id,name:t.name,min:t.min||0}));
function botDocs(){
  if(!Array.isArray(S.scen))scenInit();
  const mo=(S.scen||[]).find((s)=>s.kind==="morning"),ev=(S.scen||[]).find((s)=>s.kind==="evening"),now=Date.now(),day=S.day&&S.day.iso||dayISO();
  const morning={versions:mo?mo.versions.map((v)=>({id:v.id,name:v.name,icon:"",items:botItems(mo,v)})):[],
    today:{day:day,versionId:(S.day&&S.day.scen&&S.day.scen.morning)||null,items:rItems("morning").map((t)=>({id:t.id,name:t.name,min:t.min||0,done:!!t.done,spent:Math.round(t.spent||0)}))}};
  const evening={items:ev&&ev.versions[0]?botItems(ev,ev.versions[0]):[],today:{day:day,items:rItems("evening").map((t)=>({id:t.id,name:t.name,min:t.min||0,done:!!t.done,spent:Math.round(t.spent||0)}))}};
  const pl=(w)=>S.tasks.filter((t)=>t.type==="дела"&&!t.routine&&!t.link&&!t.archived&&t.where===w).sort((a,b)=>(a.ord||0)-(b.ord||0)).map((t)=>({id:t.id,name:t.name,min:t.min||0,done:!!t.done}));
  return{"bot-morning":{schema:1,updatedAt:now,tz:"Asia/Ho_Chi_Minh",defaults:{morning:{1:"fast",2:"home",3:"fast",4:"home",5:"fast",6:"home",0:"home"}},morning:morning,evening:evening},
    "bot-plan":{schema:1,updatedAt:now,day:day,today:pl("today"),tomorrow:pl("tomorrow")}}}
async function botPush(){
  try{const db=await window.claude?.use("db");if(!db)return;const col=db.collection();
    const docs=botDocs();for(const id of Object.keys(docs)){const d=docs[id],key=JSON.stringify(Object.assign({},d,{updatedAt:0}));
      if(BOT_LAST[id]===key)continue;BOT_LAST[id]=key;await col.doc(id).set(d)}}catch{}}
function botSync(){if(!window.claude)return;clearTimeout(BOT_T);BOT_T=setTimeout(botPush,1500)}
const VIEWS={habits:renderHabits,stats:renderStats,plan:renderPlan,scen:renderScenTabs,map:renderMap};
function boot(){
  const v1=read(V1);
  if(!v1){document.getElementById("view").innerHTML=
    '<div class="empty">Данные v1 не найдены в этом браузере. Открой сначала рабочую версию и дождись загрузки задач.</div>';return}
  S=migrate(v1);S.seedMorning=true;S.morningOnly=false;save();render();
}
function fromBeta(){const b=read("lifeos.v2");if(!(b&&b.v===2&&Array.isArray(b.tasks)))return false;
  S=JSON.parse(JSON.stringify(b));S.tasks.forEach((t)=>{if(t.tm===undefined)t.tm=null});save();
  ["ui","fold","ckshow","focus"].forEach((k)=>{const x=localStorage.getItem("lifeos.v2."+k);if(x!=null){try{localStorage.setItem("lifeos.v2b."+k,x)}catch{}}});return true}
function seedMorning(){
  if(S.seedMorning)return;S.seedMorning=true;
  if(S.tasks.some((t)=>t.routine==="morning")){save();return}
  [["Душ 🚿",10],["Почистить зубы 🪥",0],["Выпить воды 💧",0],["Одеться 👕",0],["Заварить чай 🫖",5],["Лёд на лицо 🥶",2],["Зарядка 🏋️",15],["Приготовить завтрак 🍳",15],["Позавтракать 🍳",20],["Выход из дома 💼",0]]
    .forEach(([n,m],i)=>{const t=task({name:n,min:m},{routine:"morning",where:"today"});t.ord=i+1;S.tasks.push(t)});save()}
function start(){
  initFocusBtn();
  const v2=read(V2);
  if(v2&&v2.v===2&&Array.isArray(v2.tasks)){S=v2;S.tasks.forEach((t)=>{if(t.tm===undefined)t.tm=null});ensureExtras();seedMorning();if(S.morningOnly===undefined){S.morningOnly=true;save()}render();return}
  if(fromBeta()){ensureExtras();seedMorning();if(S.morningOnly===undefined)S.morningOnly=true;save();render();return}
  boot();
}
start();
</script>
</body>
