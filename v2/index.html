<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LifeOS v2 — бета</title>
<style>
:root{--bg:#ECEEF2;--surface:#FFFFFF;--surface-2:#F5F6F9;--ink:#14161C;--muted:#6A7183;--line:#D9DDE6;
 --accent:#FF5A1F;--done:#23A06A;
 --pc-orange-bg:#FFE6D9;--pc-orange:#A8410F;--pc-red-bg:#FBE0DE;--pc-red:#A3261C;
 --pc-yellow-bg:#FBF0CF;--pc-yellow:#7E5A00;--pc-violet-bg:#ECE5FC;--pc-violet:#5B3CC4;
 --pc-blue-bg:#DFEAFC;--pc-blue:#1F5BB8;--pc-green-bg:#DCF1E3;--pc-green:#17693F;
 --pc-aqua-bg:#D8F2F2;--pc-aqua:#0F6B6B;--pc-gray-bg:#E7E9EE;--pc-gray:#4B5263;}
@media (prefers-color-scheme:dark){:root{--bg:#0F1116;--surface:#191C24;--surface-2:#14171E;--ink:#EEF0F5;--muted:#8C93A5;--line:#272B36;
 --accent:#FF6E35;--done:#36C383;
 --pc-orange-bg:#3A2116;--pc-orange:#FF9F6E;--pc-red-bg:#3A1A18;--pc-red:#FF8F86;
 --pc-yellow-bg:#352B12;--pc-yellow:#F2C14E;--pc-violet-bg:#2A2142;--pc-violet:#B9A3FF;
 --pc-blue-bg:#172840;--pc-blue:#8DB8FF;--pc-green-bg:#13301F;--pc-green:#6FD49B;
 --pc-aqua-bg:#11302F;--pc-aqua:#6ED6D3;--pc-gray-bg:#262A33;--pc-gray:#A9B0C0;color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif;
 padding:16px 14px calc(28px + env(safe-area-inset-bottom));max-width:1180px;margin-inline:auto}
h1{font-size:26px;margin:0 0 2px;letter-spacing:-.02em}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.vsw{margin:0}
.vsw a{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 14px;border-radius:999px;
 font-weight:800;font-size:12px;color:var(--muted);text-decoration:none}
.vsw a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:13px;
 padding:8px 15px;border-radius:999px;cursor:pointer;min-height:38px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hint{color:var(--muted);font-size:12px;margin:0 0 12px}
/* ---------- одна карточка ---------- */
.card{display:flex;align-items:center;gap:10px;min-width:0;background:var(--surface);border:1px solid var(--line);
 border-radius:16px;padding:10px 12px;margin-bottom:7px;min-height:56px}
.card.done{opacity:.55}
.card.v{flex-direction:column;align-items:stretch;gap:6px;padding:10px 11px}
.card.v .top{display:flex;align-items:flex-start;gap:9px;min-width:0}
.card.v .nm{white-space:normal;overflow:visible;line-height:1.25}
.card.v .row2{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.card.done .nm{text-decoration:line-through}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.card.done .ck{background:var(--done);border-color:var(--done);color:#fff;font-size:13px;font-weight:900}
.txt{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;min-width:0}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.ckn,.subn{font-size:11px;font-weight:700;color:var(--muted)}
.desc{min-width:0;max-width:100%;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at{font-size:13px;font-weight:700;color:var(--muted);flex:none}
.mins{flex:none;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;
 padding:6px 12px;font-size:13px;font-weight:800;background:transparent;color:var(--ink);cursor:pointer}
.mins.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.mins,.play{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;font-variant-numeric:tabular-nums}
.mins.run{background:var(--accent);border-color:var(--accent);color:#fff}
.mins.pause{border-style:dashed}
.mins.over{background:var(--pc-red-bg);border-color:var(--pc-red);color:var(--pc-red)}
.play.run{background:var(--accent);border-color:var(--accent);color:#fff}
.play.over{background:var(--pc-red-bg);border-color:var(--pc-red);color:var(--pc-red)}
.fbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:800;font-size:13px;
 padding:8px 15px;border-radius:999px;cursor:pointer;min-height:38px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.fbtn[hidden]{display:none}
.fbtn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:14px;
 box-shadow:0 8px 28px rgba(0,0,0,.22);padding:6px;min-width:176px}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;
 font-weight:700;font-size:14px;padding:10px 12px;border-radius:9px;cursor:pointer;white-space:pre}
.pop button:hover{background:var(--surface-2)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));z-index:60;
 background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center}
.toast button{border:0;background:transparent;color:var(--accent);font:inherit;font-weight:800;cursor:pointer}
.pc-orange{background:var(--pc-orange-bg);color:var(--pc-orange)}.pc-red{background:var(--pc-red-bg);color:var(--pc-red)}
.pc-yellow{background:var(--pc-yellow-bg);color:var(--pc-yellow)}.pc-violet{background:var(--pc-violet-bg);color:var(--pc-violet)}
.pc-blue{background:var(--pc-blue-bg);color:var(--pc-blue)}.pc-green{background:var(--pc-green-bg);color:var(--pc-green)}
.pc-aqua{background:var(--pc-aqua-bg);color:var(--pc-aqua)}.pc-gray{background:var(--pc-gray-bg);color:var(--pc-gray)}
/* ---------- окружения ---------- */
.kb::-webkit-scrollbar{height:8px}.kb::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.ghead{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between}
.tl{position:relative;padding-left:52px}
.tl .hr{position:relative;height:56px;border-top:1px solid var(--line)}
.tl .hr span{position:absolute;z-index:4;left:-52px;top:-9px;font-size:11px;font-weight:800;color:var(--muted);width:44px;text-align:right}
.tl .slot{position:absolute;left:0;right:0}
.tl .slot .card{height:100%;margin:0;align-items:flex-start}
.tl .slot .card .txt{align-self:center}
.tl .now{position:absolute;left:-6px;right:0;height:2px;background:var(--accent);z-index:3}
.tl .now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.kb{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;scroll-snap-type:x mandatory;width:100vw;margin-left:calc(50% - 50vw)}
.kb .col{flex:0 0 272px;min-width:272px;scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:10px}
.kb .col{background:var(--cbg,var(--surface-2));border-color:var(--cln,var(--line))}
.kb .col h3{margin:2px 2px 10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800}
.kb .col h3 .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
 text-transform:uppercase;letter-spacing:.04em;background:var(--ctag,var(--surface));color:var(--cink,var(--muted))}
.kb .col h3 .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.kb .col h3 .cnt{color:var(--cink,var(--muted));font-size:13px}
.kb .col .add{margin-top:8px;width:100%;border:0;background:transparent;color:var(--cink,var(--muted));
 font:inherit;font-weight:800;font-size:13px;text-align:left;padding:8px 4px;border-radius:10px;cursor:pointer;opacity:.85}
.kb .col .add:hover{background:color-mix(in srgb,var(--cink,var(--muted)) 10%,transparent)}
.card.v .prog{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.card.v .prog i{display:block;height:100%;background:var(--accent)}
.card.v .pmeta{font-size:11px;font-weight:700;color:var(--muted)}
.card.v .row2{justify-content:space-between;align-items:center;gap:8px;min-height:30px}
.card.v .r2r{display:flex;align-items:center;gap:8px;flex:none}
.card.v .pmeta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;
 color:var(--ink);font-size:12px;line-height:1;cursor:pointer;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:76px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 6px;font-size:11px}
.cal .day.out{opacity:.35}
.cal .day.today{border-color:var(--accent);border-width:2px}
.cal .n{font-weight:800;color:var(--muted);display:block;margin-bottom:3px}
.cal .ev{background:var(--surface-2);border-radius:7px;padding:3px 5px;margin-bottom:3px;font-weight:700;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.empty{color:var(--muted);font-size:13px;padding:10px 2px}
.foot{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.foot a,.foot button{flex:1;min-width:150px;min-height:46px;display:flex;align-items:center;justify-content:center;
 border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);
 font:inherit;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer}
.note{font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="head">
  <div><h1>LifeOS</h1><div class="sub">Бета. Рабочая версия не затронута.</div></div>
  <div class="seg vsw"><a href="../index.html">V1</a><a class="on" href="#">Beta</a></div>
</div>
<div class="bar">
  <div class="seg" id="sysSeg"></div>
  <div class="seg" id="envSeg"></div>
  <button class="fbtn" id="fbtn" type="button" hidden>🔥 Фокус</button>
  </div>
<p class="hint" id="hint"></p>
<div id="view"></div>
<div class="foot">
  <button id="again">Пересобрать из v1</button>
</div>
<p class="note">Это превью: видно, как одна и та же задача выглядит в четырёх окружениях.
Перетаскивание и редактирование появятся следующими шагами. Данные берутся из v1 один раз, дальше бета живёт в своей копии <code>lifeos.v2</code>.</p>

<script>
"use strict";
const V1="lifeos.v1", V2="lifeos.v2";
const read=(k)=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):null}catch{return null}};
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const esc=(s)=>String(s==null?"":s);

/* ---------- база: одна задача, одна форма (ARCHITECTURE.md §4) ---------- */
function task(src,over){
  return Object.assign({
    id:String(src.id||Math.random().toString(36).slice(2)),
    name:String(src.name||""), desc:String(src.note||src.desc||""),
    check:Array.isArray(src.check)?src.check:[],
    type:"дела", project:src.project||"", routine:"",
    where:src.where||"", ord:0,
    at:src.at||"", due:src.due||"", min:Number(src.min)||0,
    spent:+src.spent||0, sessions:+src.sessions||0, acc:+src.acc||0,
    done:!!src.done, doneAt:+src.doneAt||0, tm:null,
    status:src.done?"done":"", stage:"", waitUntil:src.waitUntil||"",
    link:src.link||"", rel:src.rel||"",
  },over);
}
function migrate(v1){
  const out=[], add=(t)=>{t.ord=out.length;out.push(t)};
  (v1.tasks||[]).forEach((t)=>add(task(t,{type:"дела",where:t.where||"today"})));
  ["morning","evening"].forEach((k)=>((v1.routines||{})[k]||[]).forEach((t)=>add(task(t,{type:"дела",routine:k,where:"today"}))));
  ((v1.work||{}).tasks||[]).forEach((t)=>add(task(t,{type:"работа",status:t.status||"",stage:t.stage||"",
    where:"",link:t.parent||"",rel:t.parent?"post":""})));
  const pj=(v1.projects||[]).map((p)=>({id:p.id,name:p.name,color:p.color||"gray",type:p.kind==="work"?"работа":"дела"}))
    .concat(((v1.work||{}).projects||[]).map((p)=>({id:p.id,name:p.name,color:p.color||"gray",type:"работа"})));
  return {v:2,migratedAt:Date.now(),projects:pj,tasks:out};
}

let S=null;
const UI={sys:"дела",env:"list"};
const COLS={
  status:[["","Не начато"],["todo","В работу"],["doing","В работе"],["wait","Жду"],["done","Готово"]],
};
const proj=(id)=>S.projects.find((p)=>p.id===id)||null;
const mine=()=>S.tasks.filter((t)=>t.type===UI.sys);

/* ---------- одна карточка на все окружения ---------- */
function card(t,opt={}){
  const li=el("div","card"+(t.done?" done":""));
  const ck=el("button","ck",t.done?"✓":"");ck.setAttribute("aria-label","Отметить");
  ck.onclick=()=>{if(t.done){t.done=false;save();render()}else complete(t)};
  li.appendChild(ck);
  const txt=el("div","txt"); txt.appendChild(el("span","nm",t.name||"Без названия"));
  const meta=el("div","meta"); const p=proj(t.project);
  if(p&&!opt.noProject){const c=el("span","chip pc-"+p.color,p.name);meta.appendChild(c)}
  if(t.check&&t.check.length&&!opt.v)meta.appendChild(el("span","ckn",t.check.filter((c)=>c.done).length+"/"+t.check.length+" ✓"));
  const kids=S.tasks.filter((x)=>x.link===t.id).length;
  if(kids)meta.appendChild(el("span","subn",kids+" подзадач"+(kids===1?"а":"и")));
  if(t.desc)meta.appendChild(el("span","desc",t.desc));
  if(meta.children.length)txt.appendChild(meta);
  if(opt.v){
    li.classList.add("v");
    const top=el("div","top");top.appendChild(li.firstChild);top.appendChild(txt);
    if(!t.done&&(t.min||t.tm)){const pl=el("button","play","▶");pl.type="button";pl.title="Таймер";pl.dataset.tid=t.id;wirePill(pl,t);top.appendChild(pl)}
    li.appendChild(top);
    if(t.min){const pr=el("div","prog"),i=el("i");
      i.style.width=Math.min(100,Math.round((spentOf(t)/60000)/t.min*100))+"%";pr.appendChild(i);li.appendChild(pr)}
    const r2=el("div","row2");
    r2.appendChild(el("span","pmeta",(t.min?Math.round(spentOf(t)/60000)+" из "+t.min+" мин":"")
      +(t.check&&t.check.length?(t.min?"  ·  ":"")+t.check.filter((c)=>c.done).length+"/"+t.check.length+" ✓":"")));
    const right=el("div","r2r");
    if(t.at&&!opt.noAt)right.appendChild(el("span","at",t.at));
    r2.appendChild(right);
    li.appendChild(r2);
    return li;
  }
  li.appendChild(txt);
  if(t.at&&!opt.noAt)li.appendChild(el("span","at",t.at));
  if(t.done){if(t.min)li.appendChild(el("span","mins",Math.max(1,Math.round((t.spent||0)/60000))+" из "+t.min+" мин"))}
  else{const pl=el("button","mins"+(opt.hot?" hot":""),"");pl.type="button";pl.dataset.tid=t.id;wirePill(pl,t);li.appendChild(pl)}
  return li;
}

/* ---------- таймер: один бегущий, остальные замораживаются ---------- */
const NOW=()=>Date.now()+(window.__off||0);
const mmss=(ms)=>{ms=Math.max(0,Math.ceil(ms/1000));return Math.floor(ms/60)+":"+String(ms%60).padStart(2,"0")};
const byId=(id)=>S.tasks.find((t)=>t.id===id);
const leftOf=(t)=>!t.tm?null:(t.tm.run?t.tm.end-NOW():t.tm.left);
const spentOf=(t)=>t.done?(t.spent||0):(t.acc||0)+(t.tm&&t.tm.run?NOW()-t.tm.seg:0);
let AC=null;
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==="suspended")AC.resume()}catch{}}
function ring(){window.__rings=(window.__rings||0)+1;
  try{audio();if(!AC)return;const t0=AC.currentTime;
    for(let i=0;i<6;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i%2?660:880;
      g.gain.setValueAtTime(0.0001,t0+i*0.5);g.gain.exponentialRampToValueAtTime(0.35,t0+i*0.5+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.5+0.4);
      o.connect(g);g.connect(AC.destination);o.start(t0+i*0.5);o.stop(t0+i*0.5+0.45)}}catch{}}
function pauseT(t){const m=t.tm;if(!m||!m.run)return;m.left=m.end-NOW();t.acc=(t.acc||0)+(NOW()-m.seg);m.run=false}
function startT(t){audio();
  S.tasks.forEach((x)=>{if(x!==t&&x.tm&&x.tm.run)pauseT(x)});
  if(!t.tm){const sw=!t.min;t.tm={run:true,sw,end:NOW()+(sw?0:t.min*60000),left:0,seg:NOW(),rang:false}}
  else if(!t.tm.run){t.tm.run=true;t.tm.end=NOW()+t.tm.left;t.tm.seg=NOW()}
  save();tick()}
function toggleT(t){if(t.tm&&t.tm.run)pauseT(t);else startT(t);save();tick()}
function addT(t,min){const add=min*60000;
  if(!t.tm){t.min=(t.min||0)+min;save();render();return}
  if(t.tm.sw)return;
  const l=leftOf(t);const nl=l<0?add:l+add;t.tm.left=nl;if(t.tm.run)t.tm.end=NOW()+nl;t.tm.rang=false;save();tick()}
function complete(t){
  if(t.tm){if(t.tm.run)pauseT(t);t.tm=null}
  t.spent=t.acc||0;t.acc=0;t.done=true;t.doneAt=NOW();if(t.type==="работа")t.status="done";
  save();render();
  if(F.on)nextInFocus(t)}
function pillText(t){
  const m=t.tm;if(!m)return "▶ "+(t.min?t.min+" мин":"старт");
  const l=leftOf(t);
  if(m.sw)return (m.run?"⏸ ":"▶ ")+mmss(-l);
  return (m.run?"⏸ ":"▶ ")+(l<0?"+"+mmss(-l):mmss(l))}
function paintPill(b,t){
  const m=t.tm,l=leftOf(t),over=!!m&&!m.sw&&l<0;
  b.classList.toggle("run",!!m&&m.run&&!over);b.classList.toggle("over",over);b.classList.toggle("pause",!!m&&!m.run);
  b.textContent=b.classList.contains("play")?(m&&m.run?"⏸":"▶"):pillText(t)}
function tick(){
  S.tasks.forEach((t)=>{const m=t.tm;if(m&&m.run&&!m.sw&&!m.rang&&m.end-NOW()<=0){m.rang=true;save();ring()}});
  document.querySelectorAll("[data-tid]").forEach((b)=>{const t=byId(b.dataset.tid);if(t&&!t.done)paintPill(b,t)})}
setInterval(()=>{if(S)tick()},500);
document.addEventListener("visibilitychange",()=>{if(S&&document.visibilityState==="visible")tick()});

/* ---------- всплывающее меню: ПКМ или долгое нажатие ---------- */
function closePop(){document.querySelectorAll(".pop").forEach((n)=>n.remove())}
function popup(x,y,items){closePop();
  const p=el("div","pop");
  items.forEach((it)=>{if(it==="-"){p.appendChild(el("hr"));return}
    const b=el("button",null,it[0]);b.type="button";b.onclick=(e)=>{e.stopPropagation();closePop();it[1]()};p.appendChild(b)});
  document.body.appendChild(p);
  const w=p.offsetWidth,h=p.offsetHeight;
  p.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+"px";p.style.top=Math.max(8,Math.min(y,innerHeight-h-8))+"px"}
document.addEventListener("click",closePop);
function onMenu(node,open){
  let tm=null,fired=false,sx=0,sy=0;
  node.addEventListener("contextmenu",(e)=>{e.preventDefault();open(e.clientX,e.clientY)});
  node.addEventListener("touchstart",(e)=>{fired=false;const p=e.touches[0];sx=p.clientX;sy=p.clientY;
    tm=setTimeout(()=>{fired=true;open(sx,sy)},500)},{passive:true});
  const stop=()=>clearTimeout(tm);
  node.addEventListener("touchmove",stop,{passive:true});node.addEventListener("touchcancel",stop);
  node.addEventListener("touchend",(e)=>{stop();if(fired)e.preventDefault()});
  node.addEventListener("click",(e)=>{if(fired){e.stopImmediatePropagation();e.preventDefault();fired=false}},true)}
function wirePill(b,t){
  b.onclick=(e)=>{e.stopPropagation();toggleT(t)};
  onMenu(b,(x,y)=>{
    const items=[];
    if(t.tm)items.push([t.tm.run?"⏸ Пауза":"▶ Продолжить",()=>toggleT(t)],"-");
    if(!(t.tm&&t.tm.sw))[1,5,10,15].forEach((m)=>items.push(["+ "+m+" мин",()=>addT(t,m)]));
    items.push("-",["✓ Готово",()=>complete(t)]);
    popup(x,y,items)});
  paintPill(b,t)}

/* ---------- фокус: запоминающий фильтр над «Сегодня» (Дела) / ToDo (Работа) ---------- */
const FK="lifeos.v2.focus";
const PRESETS=[["n3","Первые 3",{n:3}],["n5","Первые 5",{n:5}],["m30","30 мин",{m:30}],["m60","1 час",{m:60}],["m90","1,5 часа",{m:90}],["m120","2 часа",{m:120}]];
const dayISO=()=>{const d=new Date(NOW());return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let F=Object.assign({on:false,preset:"n3",day:"",ids:{}},read(FK)||{});
const saveF=()=>{try{localStorage.setItem(FK,JSON.stringify(F))}catch{}};
function candidates(sys){
  return S.tasks.filter((t)=>t.type===sys&&!t.link&&!t.done&&(sys==="дела"?(t.where||"")==="today":t.status==="todo"))}
function focusCompute(sys){
  const pr=PRESETS.find((p)=>p[0]===F.preset)[2],c=candidates(sys),out=[];
  if(pr.n)c.slice(0,pr.n).forEach((t)=>out.push(t.id));
  else{let sum=0;for(const t of c){if(sum+(t.min||0)>pr.m)break;sum+=t.min||0;out.push(t.id)}}
  F.ids[sys]=out;F.day=dayISO();saveF()}
function focusEnsure(sys){if(F.on&&(F.day!==dayISO()||!F.ids[sys]))focusCompute(sys)}
function closeToast(){const o=document.getElementById("toast");if(o){clearTimeout(o._t);o.remove()}}
function nextInFocus(done){
  const ids=F.ids[done.type]||[],n=ids.map(byId).find((x)=>x&&!x.done&&x.min>0);
  if(!n)return;
  closeToast();const tz=el("div","toast");tz.id="toast";tz.appendChild(el("span",null,"Следующая: "+n.name+" — старт через 3 с"));
  const c=el("button",null,"Отмена");c.onclick=()=>{clearTimeout(tz._t);tz.remove()};tz.appendChild(c);
  tz._t=setTimeout(()=>{tz.remove();startT(n);render()},3000);document.body.appendChild(tz)}
function paintFocusBtn(){
  const b=document.getElementById("fbtn");b.hidden=UI.env!=="list";
  const pr=PRESETS.find((p)=>p[0]===F.preset);
  b.classList.toggle("on",F.on);b.setAttribute("aria-pressed",F.on);
  b.textContent="🔥 Фокус"+(F.on?" · "+pr[1].toLowerCase():"")}
function initFocusBtn(){const b=document.getElementById("fbtn");let fired=false;
  b.onclick=()=>{if(fired){fired=false;return}F.on=!F.on;if(F.on)focusCompute(UI.sys);saveF();render()};
  onMenu(b,(x,y)=>{fired=true;setTimeout(()=>{fired=false},400);
    const items=PRESETS.map(([k,l])=>[(F.preset===k?"✓ ":"    ")+l,()=>{F.preset=k;F.on=true;focusCompute(UI.sys);render()}]);
    items.push("-",["⟳ Обновить набор",()=>{F.on=true;focusCompute(UI.sys);render()}]);
    if(F.on)items.push(["Выключить фокус",()=>{F.on=false;saveF();render()}]);
    popup(x,y,items)})}

/* ---------- окружения: фильтр, раскладка, чего не хватает ---------- */
const ENVS={
  list:{name:"Список",render(host){
    if(F.on){focusEnsure(UI.sys);
      const items=(F.ids[UI.sys]||[]).map(byId).filter(Boolean);
      const h=el("div","ghead");h.appendChild(el("span",null,"Фокус"));
      h.appendChild(el("span",null,items.length+" · "+items.reduce((a,t)=>a+(t.done?0:t.min),0)+" мин"));host.appendChild(h);
      if(!items.length)host.appendChild(el("div","empty","Нет задач под этот фильтр. ПКМ на «Фокус» — выбрать другой."));
      items.forEach((t)=>host.appendChild(card(t)));return}
    const groups=[["today","Сегодня"],["tomorrow","Завтра"],["backlog","Дела"],["wait","Жду"],["","Без места"]];
    let any=false;
    groups.forEach(([k,label])=>{
      const items=mine().filter((t)=>!t.link&&(t.where||"")===k);
      if(!items.length)return; any=true;
      const h=el("div","ghead");h.appendChild(el("span",null,label));
      h.appendChild(el("span",null,items.length+" · "+items.reduce((s,t)=>s+(t.done?0:t.min),0)+" мин"));
      host.appendChild(h);
      items.forEach((t)=>{host.appendChild(card(t));
        S.tasks.filter((x)=>x.link===t.id).forEach((k2)=>{const c=card(k2);c.style.marginLeft="26px";host.appendChild(c)})});
    });
    if(!any)host.appendChild(el("div","empty","В этой системе пока нет задач."));
  }},
  timeline:{name:"Таймлайн",render(host){
    const H0=8,H1=23,PX=56;
    const withAt=mine().filter((t)=>t.at),none=mine().filter((t)=>!t.at);
    const wrap=el("div","tl");
    for(let h=H0;h<=H1;h++){const r=el("div","hr");r.appendChild(el("span",null,String(h).padStart(2,"0")+":00"));wrap.appendChild(r)}
    const now=new Date(),nm=now.getHours()+now.getMinutes()/60;
    if(nm>=H0&&nm<=H1){const n=el("div","now");n.style.top=((nm-H0)*PX)+"px";wrap.appendChild(n)}
    withAt.forEach((t)=>{const [hh,mm]=t.at.split(":").map(Number);const top=(hh+mm/60-H0)*PX;
      if(top<0)return;const s=el("div","slot");s.style.top=top+"px";
      s.style.height=Math.max(50,(t.min||30)/60*PX)+"px";
      s.appendChild(card(t,{noAt:true}));wrap.appendChild(s)});
    wrap.style.height=((H1-H0+1)*PX)+"px";
    host.appendChild(wrap);
    const h=el("div","ghead");h.appendChild(el("span",null,"Без времени"));h.appendChild(el("span",null,String(none.length)));
    host.appendChild(h);
    if(!none.length)host.appendChild(el("div","empty","Пусто — у всех задач есть время."));
    none.forEach((t)=>host.appendChild(card(t)));
  }},
  kanban:{name:"Канбан",render(host){
    const SC={"":"gray",todo:"blue",doing:"yellow",wait:"violet",done:"green"};
    const board=(label,cols,prop)=>{
      host.appendChild(el("div","ghead")).appendChild(el("span",null,label));
      const kb=el("div","kb");
      cols.forEach(([k,title,color])=>{
        const items=mine().filter((t)=>(t[prop]||"")===k);
        const c=el("div","col"),col=color||"gray";
        c.style.setProperty("--cbg","color-mix(in srgb, var(--pc-"+col+"-bg) 55%, var(--surface-2))");
        c.style.setProperty("--cln","color-mix(in srgb, var(--pc-"+col+") 22%, var(--line))");
        c.style.setProperty("--ctag","var(--pc-"+col+"-bg)");
        c.style.setProperty("--cink","var(--pc-"+col+")");
        const h=el("h3");h.appendChild(el("span","tag",title));h.appendChild(el("span","cnt",String(items.length)));
        c.appendChild(h);
        items.forEach((t)=>c.appendChild(card(t,{v:true,noProject:prop==="project"})));
        const add=el("button","add","+ Задача");
        add.onclick=()=>{const t=task({name:"Новая задача",min:25},{type:UI.sys,[prop]:k,ord:S.tasks.length});
          S.tasks.push(t);save();render()};
        c.appendChild(add);
        kb.appendChild(c);
      });
      host.appendChild(kb);
    };
    board("По статусу",COLS.status.map(([k,t])=>[k,t,SC[k]]),"status");
    const pcols=S.projects.filter((p)=>p.type===UI.sys).map((p)=>[p.id,p.name,p.color]);
    pcols.push(["","Без проекта","gray"]);
    board("По проектам",pcols,"project");
  }},
  calendar:{name:"Календарь",render(host){
    const withDue=mine().filter((t)=>t.due),none=mine().filter((t)=>!t.due);
    const now=new Date(),y=now.getFullYear(),m=now.getMonth();
    const first=new Date(y,m,1),shift=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
    const iso=(d)=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const g=el("div","cal");
    ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach((d)=>g.appendChild(el("div","dow",d)));
    for(let i=0;i<shift;i++)g.appendChild(el("div","day out"));
    for(let d=1;d<=days;d++){
      const date=new Date(y,m,d),key=iso(date);
      const cell=el("div","day"+(key===iso(now)?" today":""));
      cell.appendChild(el("span","n",String(d)));
      withDue.filter((t)=>t.due===key).forEach((t)=>cell.appendChild(el("div","ev",t.name)));
      g.appendChild(cell);
    }
    host.appendChild(g);
    const h=el("div","ghead");h.appendChild(el("span",null,"Без даты"));h.appendChild(el("span",null,String(none.length)));
    host.appendChild(h);
    none.slice(0,8).forEach((t)=>host.appendChild(card(t)));
    if(none.length>8)host.appendChild(el("div","empty","…и ещё "+(none.length-8)));
  }},
};
const HINTS={
  list:"Ручной порядок внутри группы. Перенос меняет «куда положена» и позицию.",
  timeline:"Раскладка по времени начала. Задачи без времени лежат под сеткой — их можно будет перетащить на час.",
  kanban:"Две доски над одними задачами: по статусу и по проектам. Перенос между колонками записывает это свойство.",
  calendar:"Раскладка по дате задачи. Без даты — список под календарём.",
};

function seg(host,items,cur,pick){
  host.innerHTML="";
  items.forEach(([k,label])=>{const b=el("button",null,label);b.setAttribute("aria-pressed",k===cur);b.onclick=()=>pick(k);host.appendChild(b)});
}
function save(){try{localStorage.setItem(V2,JSON.stringify(S))}catch{}}
function render(){
  seg(document.getElementById("sysSeg"),[["дела","Дела"],["работа","Работа"]],UI.sys,(k)=>{UI.sys=k;render()});
  seg(document.getElementById("envSeg"),Object.keys(ENVS).map((k)=>[k,ENVS[k].name]),UI.env,(k)=>{UI.env=k;render()});
  document.getElementById("hint").textContent=HINTS[UI.env];
  paintFocusBtn();
  const v=document.getElementById("view");v.innerHTML="";
  ENVS[UI.env].render(v);
}
function boot(){
  const v1=read(V1);
  if(!v1){document.getElementById("view").innerHTML=
    '<div class="empty">Данные v1 не найдены в этом браузере. Открой сначала рабочую версию и дождись загрузки задач.</div>';return}
  S=migrate(v1);save();render();
}
function start(){
  initFocusBtn();
  const v2=read(V2);
  if(v2&&v2.v===2&&Array.isArray(v2.tasks)){S=v2;S.tasks.forEach((t)=>{if(t.tm===undefined)t.tm=null});render();return}
  boot();
}
document.getElementById("again").onclick=()=>{if(confirm("Пересобрать из v1? Таймеры и фокус беты сбросятся."))boot()};
start();
</script>
